summary: |
  机器人运动学研究关节空间与任务空间之间的映射关系。

  **正运动学（Forward Kinematics）**：给定关节角度，计算末端执行器的位姿。使用DH参数法（Denavit-Hartenberg）建立连杆坐标系，通过4个参数（a, α, d, θ）描述相邻连杆间的变换关系，连乘所有变换矩阵得到末端位姿。

  **逆运动学（Inverse Kinematics）**：给定末端目标位姿，求解关节角度。存在解析法（几何法、代数法）和数值法（雅可比伪逆、牛顿-拉夫逊迭代）两大类。解析法速度快但只适用于特定构型；数值法通用但可能收敛到局部最优。

  **雅可比矩阵**：描述关节速度到末端速度的线性映射，是力控制和速度控制的核心工具。
