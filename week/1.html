-sm text-muted mt-2 line-clamp-2 leading-relaxed">## 来源

## 内容
MHA（Multi-Head Attention）每个head有独立的K/V，计算量大但效果最好； MQA（Multi-Query Attention）所有head共享一组K/V，省显存但表达能力弱； GQA（Grouped Query Attention）折中方案，将head分组，每组共享K/V，是大模型推理首选； MLA（Multi-head Latent Attention，DeepSeek）将K/V压缩到低维latent空间再展开，极致压缩KV Cache。
**核心结论**： - 训练：MHA（精度优先） - 推理：GQA（显存与效果平衡） - 极致压缩：MLA（DeepSeek专属）


## 关键要点
- {&#x27;MHA&#x27;: &#x27;每个attention head有独立的Q、K、V投影，参数量=3×d_model×d_kv×n_heads&#x27;}
- {&#x27;MQA&#x27;: &#x27;所有head共享K、V，参数量大幅减少，但不同head无法关注不同语义空间&#x27;}
- {&#x27;GQA&#x27;: &#x27;n_heads个Q分成n_groups组，每组共享K、V，n_groups=1即MQA，n_groups=n_heads即MHA&#x27;}
- GQA在LLaMA2/3、Mistral等主流模型中广泛使用，通常n_groups=8
- MLA核心思想：将K、V先投影到低维latent，再通过up-projection恢复，训练时存full KV，推理时只存latent
- KV Cache大小对比：MHA(1x) &gt; GQA(1/group_ratio) &gt; MQA(1/n_heads) ≈ MLA(约1/4~1/10)

## 内容
完整覆盖Attention家族所有变体的代码实现与原理： 1. Self-Attention（单头标准实现，Q=K=V来自同一输入） 2. Cross-Attention（Q来自decoder，K/V来自encoder） 3. Multi-Head Attention（并行多头，concat后投影） 4. MHA with KV Cache（推理时缓存历史K/V，避免重复计算） 5. Multi-Query Attention（所有head共享K/V） 6. Grouped Query Attention（分组共享K/V） 7. MLA原理/代码（DeepSeek的极致KV压缩方案） 8. 配套知识点：Softmax数值稳定（减max防溢出）、Cross Entropy Loss、RoPE旋转位置编码、KL散度
**实现要点**： - Attention公式：O = softmax(QK^T/√d_k) · V - 除以√d_k防止内积过大导致softmax梯度消失 - KV Cache：推理时每个token的K/V只算一次，存下来复用 - Python/PyTorch实现：矩阵运算 + einops/einsum
这篇笔记覆盖了16页精华内容，从基础到进阶的Attention全家桶。


## 关键要点
- {&#x27;Self-Attention&#x27;: &#x27;Q/K/V通过三个线性层从同一输入投影，计算Scaled Dot-Product Attention&#x27;}
- {&#x27;Cross-Attention&#x27;: &#x27;decoder的Q关注encoder输出的K/V，应用于Encoder-Decoder架构&#x27;}
- {&#x27;MHA&#x27;: &#x27;n_head个独立的Attention并行计算，输出concat后经W_o投影，参数量=4×d_model²&#x27;}
- KV Cache原理：自回归解码时，已生成token的K/V不需要重复计算，直接拼接到当前输入前
- {&#x27;MQA&#x27;: &#x27;所有head共享K/V矩阵，参数量降至(2+2/n_head)×d_model²，训练速度提升但精度略降&#x27;}
- {&#x27;GQA&#x27;: &#x27;将head分成n_groups组，组内共享K/V，trade-off最优&#x27;}
- {&#x27;MLA&#x27;: &#x27;K/V→down_proj(latent)→up_proj，推理时只存latent表示，大幅减少KV Cache体积&#x27;}
- Softmax稳定技巧：x - max(x)避免e^x数值溢出
- {&#x27;CE Loss&#x27;: &#x27;-∑y_true·log(softmax(logits))，与softmax组合有梯度简化&#x27;}

ce\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"qGs-v4gzfOS06h0eFRT_0\"}\n"])</script><script>self.__next_f.push([1,"12:[]\nc:\"$W12\"\n"])</script><script>self.__next_f.push([1,"13:I[80875,[\"/review-handbook/_next/static/chunks/28-evnhkoub7g.js\",\"/review-handbook/_next/static/chunks/14mrh2-p_w84d.js\",\"/review-handbook/_next/static/chunks/0nn2k6-01tx8b.js\"],\"default\"]\n14:T74f,## 来源\n- [xiaohongshu] [MHA/MQA/GQA 一张图看懂！](https://www.xiaohongshu.com/explore/6950e1de000000001e00e177)\n\n## 内容\nMHA（Multi-Head Attention）每个head有独立的K/V，计算量大但效果最好； MQA（Multi-Query Attention）所有head共享一组K/V，省显存但表达能力弱； GQA（Grouped Query Attention）折中方案，将head分组，每组共享K/V，是大模型推理首选； MLA（Multi-head Latent Attention，DeepSeek）将K/V压缩到低维latent空间再展开，极致压缩KV Cache。\n**核心结论**： - 训练：MHA（精度优先） - 推理：GQA（显存与效果平衡） - 极致压缩：MLA（DeepSeek专属）\n\n\n## 关键要点\n- {'MHA': '每个attention head有独立的Q、K、V投影，参数量=3×d_model×d_kv×n_heads'}\n- {'MQA': '所有head共享K、V，参数量大幅减少，但不同head无法关注不同语义空间'}\n- {'GQA': 'n_heads个Q分成n_groups组，每组共享K、V，n_groups=1即MQA，n_groups=n_heads即MHA'}\n- GQA在LLaMA2/3、Mistral等主流模型中广泛使用，通常n_groups=8\n- MLA核心思想：将K、V先投影到低维latent，再通过up-projection恢复，训练时存full KV，推理时只存latent\n- KV Cache大小对比：MHA(1x) \u003e GQA(1/group_ratio) \u003e MQA(1/n_heads) ≈ MLA(约1/4~1/10)\n\n## 自测问题\n- MHA、MQA、GQA的区别？各自参数量和KV Cache大小如何计算？\n- 为什么GQA是当前大模型推理的主流选择？\n- MLA如何做到比GQA更极致的KV压缩？其核心insight是什么？\n- 实际训练中如何处理GQA的group分配？\n\n## 图片\n![MHA vs MQA vs GQA 对比图](http://sns-webpic-qc.xhscdn.com/202606222256/75157530ea33be96bb66eaa23afb6eb1/spectrum/1040g0k031qklje3ogm0040to5t11l9rtq78eg1o!nc_n_webp_mw_1)\n*MHA vs MQA vs GQA 对比图*\n\n## 相关笔记\n- [[fnd-week01-transformer-block]]\n- [[qa-week01-attn-complexity]]15:T9ab,"])</script><script>self.__next_f.push([1,"## 来源\n- [xiaohongshu] [手撕Attention](https://www.xiaohongshu.com/explore/69ad304c000000002202302a)\n\n## 内容\n完整覆盖Attention家族所有变体的代码实现与原理： 1. Self-Attention（单头标准实现，Q=K=V来自同一输入） 2. Cross-Attention（Q来自decoder，K/V来自encoder） 3. Multi-Head Attention（并行多头，concat后投影） 4. MHA with KV Cache（推理时缓存历史K/V，避免重复计算） 5. Multi-Query Attention（所有head共享K/V） 6. Grouped Query Attention（分组共享K/V） 7. MLA原理/代码（DeepSeek的极致KV压缩方案） 8. 配套知识点：Softmax数值稳定（减max防溢出）、Cross Entropy Loss、RoPE旋转位置编码、KL散度\n**实现要点**： - Attention公式：O = softmax(QK^T/√d_k) · V - 除以√d_k防止内积过大导致softmax梯度消失 - KV Cache：推理时每个token的K/V只算一次，存下来复用 - Python/PyTorch实现：矩阵运算 + einops/einsum\n这篇笔记覆盖了16页精华内容，从基础到进阶的Attention全家桶。\n\n\n## 关键要点\n- {'Self-Attention': 'Q/K/V通过三个线性层从同一输入投影，计算Scaled Dot-Product Attention'}\n- {'Cross-Attention': 'decoder的Q关注encoder输出的K/V，应用于Encoder-Decoder架构'}\n- {'MHA': 'n_head个独立的Attention并行计算，输出concat后经W_o投影，参数量=4×d_model²'}\n- KV Cache原理：自回归解码时，已生成token的K/V不需要重复计算，直接拼接到当前输入前\n- {'MQA': '所有head共享K/V矩阵，参数量降至(2+2/n_head)×d_model²，训练速度提升但精度略降'}\n- {'GQA': '将head分成n_groups组，组内共享K/V，trade-off最优'}\n- {'MLA': 'K/V→down_proj(latent)→up_proj，推理时只存latent表示，大幅减少KV Cache体积'}\n- Softmax稳定技巧：x - max(x)避免e^x数值溢出\n- {'CE Loss': '-∑y_true·log(softmax(logits))，与softmax组合有梯度简化'}\n\n## 自测问题\n- 手写Scaled Dot-Product Attention的PyTorch代码，包含mask处理\n- KV Cache为什么能加速推理？具体减少了多少计算量？\n- MQA和GQA在代码实现上的区别是什么？\n- MLA的down/up projection如何保证语义不丢失？\n\n## 图片\n![Attention家族全景图](http://sns-webpic-qc.xhscdn.com/202606222256/360e082cd28a9ec0ba1d90a5659c6c50/spectrum/1040g34o31tdt5h1256105no6jgq08o4hiqdu920!nc_n_webp_mw_1)\n*Attention家族全景图*\n\n## 相关笔记\n- [[fnd-week01-attention]]\n- [[cod-week01-mha]]"])</script><script>self.__next_f.push([1,"16:T7e3,\u003e **💡 问题**: Attention的复杂度分析？从O(n²)优化到O(n)的路线图？\n\n## 来源\n- [xiaohongshu] [手撕Attention](https://www.xiaohongshu.com/explore/69ad304c000000002202302a)\n\n## 回答\n**标准Attention复杂度**： - 计算量：O(n²·d)，其中n是序列长度，d是head维度 - 显存：O(n²)的Attention Matrix，成为长序列瓶颈 - 例如n=128K时，Attention Matrix需要128K² ≈ 16B个元素，FP16下约32GB\n**优化路线图（按效果排序）**：\n1. **KV Cache**（推理必备）：缓存历史K/V，避免重复计算已生成token的attention。将每步计算从O(n²·d)降到O(n·d)，但显存仍是O(n)\n2. **MQA/GQA**（架构层面）：减少K/V head数，降低KV Cache显存n_head/group_ratio倍\n3. **FlashAttention**（IO优化）：通过Tiling（分块计算）将O(n²)的HBM读写降到O(n²·d²/M)，利用SRAM做局部softmax。数学等价，且由于IO减少反而更快\n4. **Sparse Attention**：只计算部分位置（sliding window + global tokens），如Mistral的SWA。复杂度O(n·w)，w是窗口大小\n5. **Linear Attention**：用核函数替代softmax，Q(K^T V)先算K^T V，复杂度O(n·d²)。代表：Mamba/SSM、RWKV\n6. **MLA**（DeepSeek）：将K/V压缩到低维latent空间，KV Cache从O(n·n_heads·d_head)降到O(n·d_latent)\n**面试回答结构**： - 先分析瓶颈（计算vs显存） - 针对瓶颈选择合适的优化（prefill→FlashAttn，decode→KV Cache+GQA+MLA） - 说明trade-off（精度损失vs效率提升）\n\n\n## 延伸思考\n- FlashAttention的Tiling和Recomputation具体怎么实现的？\n- Linear Attention为什么可以改变计算顺序？对精度的影响？\n- 长序列推理（n\u003e128K）时应该如何组合这些优化？\n\n## 图片\n![Attention优化全景](http://sns-webpic-qc.xhscdn.com/202606222256/360e082cd28a9ec0ba1d90a5659c6c50/spectrum/1040g34o31tdt5h1256105no6jgq08o4hiqdu920!nc_n_webp_mw_1)\n*Attention优化全景*\n\n## 相关笔记\n- [[fnd-week01-attention]]\n- [[fnd-week10-kv-cache]]17:T68f,\u003e **💡 问题**: Prefill vs Decode阶段的compute bound vs memory bound本质区别？\n\n## 来源\n- [xiaohongshu] [MHA/MQA/GQA 一张图看懂](https://www.xiaohongshu.com/explore/6950e1de000000001e00e177)\n\n## 回答\nLLM推理分为两个阶段，其计算特征完全不同：\n**Prefill阶段（Compute Bound）**： - 一次性处理整个输入prompt（例如1024个token） - 需要计算全部token之间的Attention（O(n²·d)） - 瓶颈在GPU算力（FLOPS），不是显存带宽 - 优化方向：FlashAttention（减少IO）、并行计算、高效的矩阵乘法（Tiling） - 关键指标：TTFT（Time To First Token）\n**Decode阶段（Memory Bound）**： - 逐个生成token，每步只处理一个新token - Attention计算量O(n·d)，很小 - 但需要读取完整的KV Cache（O(n)），瓶颈在显存带宽 - 优化方向：KV Cache压缩（GQA/MQA/MLA/量化）、显存带宽优化 - 关键指标：TPOT（Time Per Output Token）、吞吐量\n**混合优化策略（vLLM/SGLang实践）**： - Prefill和Decode分离调度（Disaggregated Prefill） - Prefill用高算力GPU（A100），Decode用更多GPU分摊KV Cache带宽 - 对于长prompt：Chunked Prefill，分段prefill避免OOM\n**面试回答要点**： - 能区分两个阶段的瓶颈（compute vs memory） - 能针对不同阶段提出优化（FlashAttn→Prefill, KV Cache优化→Decode） - 了解Disaggregated架构的价值\n\n\n## 延伸思考\n- Chunked Prefill如何平衡延迟和吞吐？\n- Disaggregated Prefill的通信开销如何控制？\n- 为什么Decode阶段不能简单地用FlashAttention加速？\n\n## 相关笔记\n- [[qa-week01-attn-complexity]]\n- [[fnd-week10-kv-cache]]"])</script><script>self.__next_f.push(
