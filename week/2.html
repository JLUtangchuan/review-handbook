cent">🔗 <!-- -->2<!-- --> 推荐</span></div><p class="text-sm text-muted mt-2 line-clamp-2 leading-relaxed">## 来源
- [xiaohongshu] [面试必备：旋转位置编码 RoPE](https://www.xiaohongshu.com/explore/695b6e5c000000001a030087)

## 内容
**位置编码演进路线**： 1. Sinusoidal（Transformer原始论文）：固定正弦编码，PE(pos,2i)=sin(pos/10000^(2i/d))。优点是不需要学习参数，有一定外推能力；缺点是相对位置信息隐含、不够灵活 2. Learned Positional Embedding（BERT/GPT）：可学习的位置向量，优点是灵活；缺点是无法处理超过训练长度的序列 3. RoPE（Rotary Position Embedding，LLaMA/Qwen/DeepSeek）：通过旋转矩阵将位置信息融入Q/K向量。核心公式：q_m = R^m·q，k_n = R^n·k，attention score = q_m^T·k_n = q^T·R^{n-m}·k，只依赖相对位置(n-m) 4. ALiBi（Attention with Linear Biases）：直接在attention score上加线性衰减偏置，(i-j)·m，简单有效 5. NoPE：最新研究发现，足够大的模型可以不使用显式位置编码
**RoPE核心优点**： - 天然编码相对位置（attention score只依赖位置差） - 可以外推到训练时未见过的长度（通过NTK-aware scaling等方法） - 与线性attention兼容 - 代码实现简洁：构造旋转矩阵→对Q/K施加旋转


## 关键要点
- {&#x27;Sinusoidal&#x27;: &#x27;PE(pos,2i)=sin(pos/theta^(2i/d)), PE(pos,2i+1)=cos(pos/theta^(2i/d))&#x27;}
- {&#x27;RoPE旋转矩阵&#x27;: &#x27;将d维向量拆成d/2对2D向量，每对用位置m的旋转角m·theta_i进行旋转&#x27;}
- {&#x27;RoPE的attention score内积&#x27;: &#x27;q^T·R^{n-m}·k，仅依赖相对位置差(n-m)&#x27;}
- {&#x27;实现核心&#x27;: &#x27;precompute cos/sin频率表 → 对Q、K分别施加旋转 → 计算attention&#x27;}
- {&#x27;NTK-aware外推&#x27;: &#x27;调整base频率(10000→更大值)让高频rotation更稀疏，支持更长序列&#x27;}
- {&#x27;YaRN方法&#x27;: &#x27;结合NTK-aware scaling + temperature tuning，是目前最优的RoPE外推方案&#x27;}
- {&#x27;ALiBi优势&#x27;: &#x27;无额外参数、训练推理一致、天然支持任意长度&#x27;}

gap-1 shrink-0"><span class="text-xl mt-0.5">📖</span></div><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><h3 class="font-semibold text-foreground leading-snug text-base">SwiGLU/GELU/GeGLU/SiLU激活函数全景</h3></div><div class="flex flex-wrap items-center gap-2 mt-2"><span class="text-[11px] px-1.5 py-0.5 rounded font-medium bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400">中等</span><span class="text-[11px] text-muted">小红书</span><span class="text-[11px] text-accent">🔗 <!-- -->2<!-- --> 推荐</span></div><p class="text-sm text-muted mt-2 line-clamp-2 leading-relaxed">## 来源
- [xiaohongshu] [大模型激活函数为什么是swiGLU？](https://www.xiaohongshu.com/explore/6921761f000000001f0061d8)

## 内容
大模型FFN中激活函数的演进：ReLU → GELU → SiLU(Swish) → SwiGLU → GeGLU
**GLU（Gated Linear Unit）家族**： GLU = (x·W₁ + b₁) ⊗ σ(x·W₂ + b₂)，即输入通过两个线性变换，一个做激活后与另一个逐元素相乘（门控）。不同GLU变体的区别在于激活函数σ的选择。
- **SwiGLU**（LLaMA/Qwen/DeepSeek）：σ = SiLU(Swish) = x·σ(x)。门控用Swish代替sigmoid，平滑可导，梯度流动更好 - **GeGLU**：σ = GELU = x·Φ(x)（Φ是标准正态CDF），理论上更接近ReLU的统计特性 - **ReGLU**：σ = ReLU，最简单但非平滑 - **为什么用GLU**：相比标准FFN（2个权重矩阵），GLU用3个权重矩阵但保持参数量不变（通过调整hidden_dim），引入了门控机制使模型能选择性传递信息
**为什么SwiGLU优于ReLU**： 1. 平滑性：处处可导，优化更稳定 2. 非单调：允许小的负值通过，防止神经元&quot;死亡&quot; 3. 门控机制：动态控制信息流，增强表达能力 4. 实证结果：LLaMA论文中SwiGLU在perplexity上显著优于ReLU 5. 梯度：SiLU的梯度在正值区域保持较大值，缓解梯度消失


## 关键要点
- SwiGLU = Swish(xW_gate) ⊗ (xW_up)，然后down_proj
- GLU参数量计算：3×d_model×d_ff（vs 标准FFN的2×d_model×d_ff），通过调整d_ff保持总参数量一致
- {&#x27;GELU&#x27;: &#x27;x·Φ(x) ≈ 0.5x(1+tanh(√(2/π)(x+0.044715x³)))&#x27;}
- {&#x27;SiLU/Swish&#x27;: &#x27;x·σ(x)，与GELU形状相似但计算更简单&#x27;}
- {&#x27;LLaMA中实际使用&#x27;: &#x27;SwiGLU + d_ff = 8/3 × d_model（补偿3个权重矩阵）&#x27;}
- 对比：ReLU(d_ff=4d) vs SwiGLU(d_ff≈2.7d)，参数量等效

1 shrink-0"><span class="text-xl mt-0.5">📖</span></div><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><h3 class="font-semibold text-foreground leading-snug text-base">LayerNorm/RMSNorm/DeepNorm/Pre-LN vs Post-LN 归一化技术演进</h3></div><div class="flex flex-wrap items-center gap-2 mt-2"><span class="text-[11px] px-1.5 py-0.5 rounded font-medium bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400">中等</span><span class="text-[11px] text-muted">小红书</span><span class="text-[11px] text-accent">🔗 <!-- -->2<!-- --> 推荐</span></div><p class="text-sm text-muted mt-2 line-clamp-2 leading-relaxed">## 来源
- [xiaohongshu] [大模型NLP面试题：LLaMA模型结构](https://www.xiaohongshu.com/explore/650c5d97000000001f00701d)

## 内容
归一化（Normalization）技术是Transformer训练稳定性的关键。演进路线：
**1. BatchNorm → LayerNorm**： - BatchNorm沿batch维度归一化，不适用于变长序列和batch size小的场景 - LayerNorm沿feature维度归一化，独立于batch size，适合NLP
**2. LayerNorm → RMSNorm**（LLaMA）： - RMSNorm只计算均方根（RMS），去掉了均值中心化 - RMSNorm(x) = x / RMS(x) · γ，其中RMS=√(mean(x²)) - 计算量约为LayerNorm的60-70%，效果相当 - 几乎所有现代LLM（LLaMA/Mistral/Qwen/DeepSeek）都用RMSNorm
**3. DeepNorm**（DeepNet，千层Transformer）： - 在残差连接前对输入做缩放：x + α·Sublayer(LN(x)) - 初始化时α&lt;1，控制残差方差 - 使1000+层Transformer稳定训练成为可能
**4. Pre-LN vs Post-LN**： - Post-LN（原始Transformer）：x + LN(Sublayer(x))，梯度容易发散 - Pre-LN（现代Transformer）：x + Sublayer(LN(x))，梯度流经残差直接传播 - 几乎所有现代LLM使用Pre-LN（实际上Pre-RMSNorm + Residual）
**5. 其他归一化技术**： - QK Norm（Gemma/某些VLM）：对Q、K单独做LayerNorm，防止attention logits过大 - Sandwich Norm（Pre+Post）：Pre-LN + Post-LN组合，一些大模型使用


## 关键要点
- {&#x27;LayerNorm&#x27;: &#x27;y = (x-μ)/σ · γ + β，两个统计量+两个可学习参数&#x27;}
- {&#x27;RMSNorm&#x27;: &#x27;y = x/√(mean(x²)+ε) · γ，只有RMS统计量+一个可学习参数（无β bias）&#x27;}
- RMSNorm去掉re-centering的原因：实证表明中心化对性能影响极小，去掉减少计算量
- {&#x27;DeepNorm&#x27;: &#x27;x_{l+1} = x_l + α·F(LN(x_l))，α在初始化时&lt;1控制方差&#x27;}
- Pre-LN优势：梯度从顶层通过残差直达底层，训练更稳定，允许更大学习率
- {&#x27;QK Norm&#x27;: &#x27;对Q和K的head维度做归一化，防止attention logits过大导致softmax饱和&#x27;}
- 层归一化位置影响：Pre-LN对Sublayer输入做归一化，Post-LN对输出做归一化

最佳排版请看原博客：

前两篇文章《重新思考学习率与Batch Size（一）：现状》和《重新思考学习率与Batch Size（二）：平均场》中，我们主要是提出了平均场方法，用以简化学习率与Batch Size的相关计算。当时我们分析的优化器是SGD、SignSGD和SoftSignSGD，并且主要目的是简化，本质上没有新的结论。

然而，在如今的优化器盛宴中，怎能少得了Muon的一席之地呢？所以，这篇文章我们就来尝试计算Muon的相关结论，看看它的学习率与Batch Size的关系是否会呈现出新的规律。

基本记号

众所周知，Muon的主要特点就是非Element-wise的更新规则，所以之前在《当Batch Size增大时，学习率该如何随之变化？》和《Adam的epsilon如何影响学习率的Scaling Law？》的Element-wise的计算方法将完全不可用。但幸运的是，上篇文章介绍的平均场依然好使，只需要稍微调整一下细节。

我们先引入一些记号。设损失函数为\mathcal{L}(\boldsymbol{W})，\boldsymbol{W}\in\mathbb{R}^{n\times m}是矩阵向量（设n\geq m），\boldsymbol{G}是它的梯度，单个样本的梯度记为\tilde{\boldsymbol{G}}，它的均值就是\boldsymbol{G}，而方差为\sigma^2；当Batch Size为B时，梯度记为\tilde{\boldsymbol{G}}_B，它的均值还是\boldsymbol{G}，但方差变为\sigma^2/B。注意，这里的方差只是一个标量\sigma^2，并不像之前那样考虑了完整的协方差矩阵。

之所以这样简化，最核心的原因是这里的随机变量本身就已经是一个矩阵，那么它对应的协方差矩阵实际上已经是一个4阶张量，这讨论起来比较麻烦。那么简化为单个标量会严重损失准确性吗？其实不会，前两篇文章我们虽然考虑了完整的协方差矩阵\boldsymbol{\Sigma}，但仔细观察就会发现最后结果只依赖于\mathop{\text{tr}}(\boldsymbol{\Sigma})，这跟开始就将它简化为标量是等价的。

海森矩阵

类似地，我们设更新量为-\eta\tilde{\boldsymbol{\Phi}}_B，考虑损失函数的二阶展开

\mathcal{L}(\boldsymbol{W} - \eta\tilde{\boldsymbol{\Phi}}_B) \approx \mathcal{L}(\boldsymbol{W}) - \eta \mathop{\text{tr}}(\tilde{\boldsymbol{\Phi}}{}_B^{\top}\boldsymbol{G}) + \frac{1}{2}\eta^2\mathop{\text{tr}}(\tilde{\boldsymbol{\Phi}}{}_B^{\top}\boldsymbol{H}\tilde{\boldsymbol{\Phi}}_B)\tag{1}

前两项应该都没什么疑问，比较难理解的第三项。跟协方差矩阵类似，这里的Hessian矩阵\boldsymbol{H}是一个4阶张量，理解起来比较麻烦。

这里最简单的切入方式应该是线性算子视角，即将\boldsymbol{H}理解为一个输入输出都是矩阵的线性算子。我们不用知道\boldsymbol{H}长什么样，也不用知道\boldsymbol{H}与\tilde{\boldsymbol{\Phi}}_B怎么运算，只需要知道\boldsymbol{H}\tilde{\boldsymbol{\Phi}}_B关于\tilde{\boldsymbol{\Phi}}_B是线性的。这样一来，我们要处理的对象依然还是矩阵，不需要增加心智负担。任何符合条件的线性算子，都可以作为Hessian矩阵的近似，但不需要写出具体的高阶张量形式。

本文的主角是Muon，我们取\tilde{\boldsymbol{\Phi}}_B=\mathop{\text{msign}}(\tilde{\boldsymbol{G}}_B)作为它的近似来进行计算。根据定义，我们写出\mathop{\text{msign}}(\tilde{\boldsymbol{G}}_B)=\tilde{\boldsymbol{G}}_B(\tilde{\boldsymbol{G}}{}_B^{\top}\tilde{\boldsymbol{G}}_B)^{-1/2}，从牛顿法视角看，这相当于假设\boldsymbol{H}^{-1}\boldsymbol{X} = \eta_{\max}\boldsymbol{X}(\boldsymbol{G}^{\top}\boldsymbol{G})^{-1/2}，于是有\boldsymbol{H}\boldsymbol{X} = \eta_{\max}^{-1}\boldsymbol{X}(\boldsymbol{G}^{\top}\boldsymbol{G})^{1/2}，这将用于后面的计算。

计算期望

对式(1)两边求期望，得到

\mathbb{E}[\mathcal{L}(\boldsymbol{W} - \eta\tilde{\boldsymbol{\Phi}}_B)] \approx \mathcal{L}(\boldsymbol{W}) - \eta \mathop{\text{tr}}(\mathbb{E}[\tilde{\boldsymbol{\Phi}}_B]^{\top}\boldsymbol{G}) + \frac{1}{2}\eta^2\mathbb{E}[\mathop{\text{tr}}(\tilde{\boldsymbol{\Phi}}{}_B^{\top}\boldsymbol{H}\tilde{\boldsymbol{\Phi}}_B)] \\

先求\mathbb{E}[\tilde{\boldsymbol{\Phi}}_B]：

\mathbb{E}[\tilde{\boldsymbol{\Phi}}_B]=\mathbb{E}[\tilde{\boldsymbol{G}}_B(\tilde{\boldsymbol{G}}{}_B^{\top}\tilde{\boldsymbol{G}}_B)^{-1/2}]\approx\mathbb{E}[\tilde{\boldsymbol{G}}_B](\mathbb{E}[\tilde{\boldsymbol{G}}{}_B^{\top}\tilde{\boldsymbol{G}}_B])^{-1/2} = \boldsymbol{G}(\mathbb{E}[\tilde{\boldsymbol{G}}{}_B^{\top}\tilde{\boldsymbol{G}}_B])^{-1/2} \\

\mathbb{E}[\tilde{\boldsymbol{G}}{}_B^{\top}\tilde{\boldsymbol{G}}_B]我们按分量写出来，并且假设不同分量之间独立，那么

\mathbb{E}[\tilde{\boldsymbol{G}}{}_B^{\top}\tilde{\boldsymbol{G}}_B]_{i,j} = \mathbb{E}\left[\sum_{k=1}^n (\tilde{G}_B)_{k,i}(\tilde{G}_B)_{k,j}\right] = \left\{\begin{aligned} \mathbb{E}\left[\sum_{k=1}^n (\tilde{G}_B)_{k,i}^2\right] = \left(\sum_{k=1}^n G_{k,i}^2\right) + n\sigma^2/B,\quad (i=j) \\[6pt] \sum_{k=1}^n \mathbb{E}[(\tilde{G}_B)_{k,i}] \mathbb{E}[(\tilde{G}_B)_{k,j}] = \sum_{k=1}^n G_{k,i}G_{k,j},\quad (i\neq j) \end{aligned}\right.\\

组合起来就是\mathbb{E}[\tilde{\boldsymbol{G}}{}_B^{\top}\tilde{\boldsymbol{G}}_B]=\boldsymbol{G}^{\top}\boldsymbol{G} + (n\sigma^2/B) \boldsymbol{I}，所以

\mathbb{E}[\tilde{\boldsymbol{\Phi}}_B]\approx \boldsymbol{G}(\boldsymbol{G}^{\top}\boldsymbol{G} + (n\sigma^2/B) \boldsymbol{I})^{-1/2} = \mathop{\text{msign}}(\boldsymbol{G})(\boldsymbol{I} + (n\sigma^2/B) (\boldsymbol{G}^{\top}\boldsymbol{G})^{-1})^{-1/2} \\

为了进一步简化B的依赖形式，我们用\mathop{\text{tr}}(\boldsymbol{G}^{\top}\boldsymbol{G})\boldsymbol{I}/m近似\boldsymbol{G}^{\top}\boldsymbol{G}，也就是只保留\boldsymbol{G}^{\top}\boldsymbol{G}的对角线部分，然后再降对角线部分替换成它们的平均。这样一来，我们得到

\mathbb{E}[\tilde{\boldsymbol{\Phi}}_B]\approx \mathop{\text{msign}}(\boldsymbol{G})(1 + \mathcal{B}_{\text{simple}}/B)^{-1/2} \\

其中\mathcal{B}_{\text{simple}} = mn\sigma^2/\mathop{\text{tr}}(\boldsymbol{G}^{\top}\boldsymbol{G})= mn\sigma^2/\Vert\boldsymbol{G}\Vert_F，这其实跟把\boldsymbol{G}当成向量，算前两篇文章的\mathcal{B}_{\text{simple}}是一样的。上式的形式跟SignSGD如出一辙，由此我们可以猜测，Muon在学习率与Batch Size的关系上不会有太多新鲜结果。

相同规律

至于\mathbb{E}[\mathop{\text{tr}}(\tilde{\boldsymbol{\Phi}}{}_B^{\top}\boldsymbol{H}\tilde{\boldsymbol{\Phi}}_B)]，我们只计算刚才推出的Muon对应的假设，即\boldsymbol{H}\boldsymbol{X} = \eta_{\max}^{-1}\boldsymbol{X}(\boldsymbol{G}^{\top}\boldsymbol{G})^{1/2}，那么

\mathop{\text{tr}}(\tilde{\boldsymbol{\Phi}}{}_B^{\top}\boldsymbol{H}\tilde{\boldsymbol{\Phi}}_B) = \eta_{\max}^{-1}\mathop{\text{tr}}(\tilde{\boldsymbol{\Phi}}{}_B^{\top}\tilde{\boldsymbol{\Phi}}_B(\boldsymbol{G}^{\top}\boldsymbol{G})^{1/2}) \\

留意到\tilde{\boldsymbol{\Phi}}_B是\mathop{\text{msign}}的结果，它一定是正交矩阵（满秩），所以\tilde{\boldsymbol{\Phi}}{}_B^{\top}\tilde{\boldsymbol{\Phi}}_B=\boldsymbol{I}，即在这个case下\mathop{\text{tr}}(\tilde{\boldsymbol{\Phi}}{}_B^{\top}\boldsymbol{H}\tilde{\boldsymbol{\Phi}}_B)是一个确定的常数\eta_{\max}^{-1}\mathop{\text{tr}}((\boldsymbol{G}^{\top}\boldsymbol{G})^{1/2})=\eta_{\max}^{-1}\mathop{\text{msign}}(\boldsymbol{G})^{\top}\boldsymbol{G}，于是我们可以得到

\eta^* \approx \frac{\mathop{\text{tr}}(\mathbb{E}[\tilde{\boldsymbol{\Phi}}_B]^{\top}\boldsymbol{G})}{\mathbb{E}[\mathop{\text{tr}}(\tilde{\boldsymbol{\Phi}}{}_B^{\top}\boldsymbol{H}\tilde{\boldsymbol{\Phi}}_B)]}\approx \frac{\eta_{\max}}{\sqrt{1 + \mathcal{B}_{\text{simple}}/B}} \\

果不其然，它跟SignSGD结果的形式完全一样，没有什么新鲜规律。

其实仔细想想就会发现这也是情理之中，因为SignSGD是直接对梯度加\mathop{\text{sign}}，而Muon的\mathop{\text{msign}}则是给奇异值加\mathop{\text{sign}}，直觉上就相当于换了个坐标系加\mathop{\text{sign}}，它带来的是新的矩阵更新规则，而学习率\eta^*和Batch Size B只是一个标量，在大家背后核心都是\mathop{\text{sign}}的前提下，这些标量的渐近关系极有可能不会发现明显变化。

当然，我们现在只算了一个特殊的\boldsymbol{H}，如果考虑更一般的\boldsymbol{H}，那么也有可能跟SignSGD一样出现“Batch Size增大，学习率反而应该减少”的Surge现象。但正如我们在上一篇文章的“原因反思”一节说的，如果真观察到Surge现象了，也许更应该要更换优化器，而不是修正\eta^*与B的关系。

文章小结

这篇文章我们尝试用平均场近似对Muon进行了简单分析，结论是它学习率与Batch Size的关系跟SignSGD一致，并无新鲜规律。

一、SIN（正弦位置编码）

二、ALiBi（Attention with Linear Biases）

思路：ALiBi（基于线性偏差的注意力机制） 不向word embedding中添加positional embedding，而是&quot;根据token之间的距离给 attention score 加上一个预设好的偏置矩阵&quot;，即直接引入相对位置。

举例：两个token之间存在一个相对位置差1，就加上一个 -1 的偏置，如果token之间的距离越远则这个负数就越大，代表它们之间的相关性更低。

三、RoPE（Rotary Position Embedding）

2021年，RoPE（旋转位置编码）诞生，它借助了复数的思想，出发点是通过绝对位置编码的方式实现相对位置编码。

设计思路：在NLP中，通常会通过向量q和k的内积来计算注意力系数（ATTN），如果能够对q、k向量注入位置信息，然后用更新的q、k向量做内积就能丝滑地引入位置信息了。

图3-1：RoPE的两种解释（左：直观解释，右：原始推导）
图3-2：RoPE的操作示意图

在transformer模型中RoPE如何使用：


q = x @ Wq  # [batch_size, seq_len, d_model] -&gt; [batch_size, seq_len, d_head]
k = x @ Wk


q_rotated = apply_rotary_pos_emb(q, position_ids)
k_rotated = apply_rotary_pos_emb(k, position_ids)

def apply_rotary_pos_emb(q, position_ids):
    # q shape: [batch_size, seq_len, dim]
    seq_len = q.shape[1]
    dim = q.shape[2]
    # 生成位置编码的角度
    theta = 1.0 / (10000 ** (torch.arange(0, dim, 2).float() / dim))
    # 计算每个位置的旋转角度
    pos_emb = position_ids.unsqueeze(-1) * theta
    # 生成cos和sin值
    cos = torch.cos(pos_emb)
    sin = torch.sin(pos_emb)
    # 将q分成两半，便于旋转操作
    q_even = q[:, :, 0::2]  # 偶数维度
    q_odd = q[:, :, 1::2]   # 奇数维度
    # 应用旋转变换
    q_out_even = q_even * cos - q_odd * sin
    q_out_odd = q_odd * cos + q_even * sin
    # 重新组合
    q_out = torch.stack([q_out_even, q_out_odd], dim=-1)
    q_out = q_out.flatten(-2)
    return q_out
四、PI（Position Interpolation）

PI（位置插值）是基于旋转位置编码RoPE进行改进，优化了外推性的问题：使用RoPE，以长度为L训练完成模型后，当输入超过L会发生性能剧烈下降，一些论文提出可以通过给模型喂一些长度大于L的输入来微调模型，进而逐步将原始窗口长度扩大，但其代价和成效不佳（实验结果如下图4-1）。

图4-3的实验代码如下：

import torch
import matplotlib.pyplot as plt


d = 4096 // 32
theta = 10000

freqs = 1.0 / (theta ** (torch.arange(0, d, 2).float() / d))

L = 2048
x = torch.arange(0, L)

xfreq = torch.outer(x, freqs)
print(xfreq.shape)
y = torch.randn(x.shape[0])

X = torch.cat([xfreq.sin(), xfreq.cos()], dim=1)

eps = 1e-5  # small regularization term

coeffs = torch.linalg.solve(X.t() @ X + torch.eye(X.shape[1]) * eps, X.t() @ y)

x2 = torch.arange(0, 2*L)
xfreq2 = torch.outer(x2, freqs)
X2 = torch.cat([xfreq2.sin(), xfreq2.cos()], dim=1)
y2 = X2 @ coeffs

x3 = torch.arange(25, 75, 0.125)
xfreq3 = torch.outer(x3, freqs)
X3 = torch.cat([xfreq3.sin(), xfreq3.cos()], dim=1)
y3 = X3 @ coeffs

plt.figure(figsize=(16, 5))

plt.subplot(1, 3, 1)
plt.plot(x2[:L], y2[:L], &quot;r&quot;)
plt.scatter(x, y)
plt.ylabel(&quot;attention score $a(s)$&quot;)
plt.xlabel(&quot;Positional difference $s$&quot;)

plt.subplot(1, 3, 2)
plt.plot(x2, y2, &quot;r&quot;)
plt.scatter(x, y)
plt.axvline(L, color=&quot;k&quot;, linestyle=&quot;--&quot;, linewidth=0.5)
plt.title(&quot;Effect of Extrapolation&quot;)
plt.xlabel(&quot;Positional difference $s$&quot;)

plt.subplot(1, 3, 3)
plt.plot(x3, y3, &quot;r&quot;)
for i in range(25, 75):

五、NTK（Neural Tangent Kernel）

现状：PI会在扩展倍数特别大时显著降低位置编码区分不同位置的能力，这种现象称之为高频信息的损失。

图5-1：PI的缺点和问题所在

NTK（Neural Tangent Kernel）的思想：高频外推+低频内插，即将 \color{blue}{\theta_{i}=b^{-2i/d}改为\theta_{i}=(b\cdot S^{d/(d-2)})^{-2i/d}}，也就是改变了基底（这里b=10000， \color{blue}{S=L&#x27;/L} ）。推导见图5-2和图5-3：

图5-2：NTK推导1——位置编码的本质是求位置n的β进制数
图5-3：NTK推导2——统一高频外推和低频内插

在代码上修改很小，如下11行：

from transformers import AutoModelForCausalLM, AutoTokenizer, GenerationConfig
import torch
import transformers

old_init = transformers.models.llama.modeling_llama.LlamaRotaryEmbedding.__init__
def ntk_scaled_init(self, dim, max_position_embeddings=2048, base=10000, device=None):
    #The method is just these three lines
    max_position_embeddings = 16384
    a = 8 #Alpha value
    base = base * a ** (dim / (dim-2)) #Base change formula # NTK-Aware
    old_init(self, dim, max_position_embeddings, base, device)
transformers.models.llama.modeling_llama.LlamaRotaryEmbedding.__init__ = ntk_scaled_init
六、YARN（Yet another RoPE extensioN method）
6.1 波长的引入

在某个维度i下，波长被定义为： \lambda_{i}=\frac{2π}{\theta_{i}}=\frac{2\pi}{b^{-2i/d}}=2\pi b^{2i/d} ，因此，有如下结论：

波长可描述为：在维度i处嵌入的旋转位置执行全旋转2π所需的token长度。
维度越高波长越长。

证明见下图6-1：

图6-1：波长描述了维度i处执行全旋转2π所需的token长度

像PI和NTK这种类型的插值方案不关心波长的维数，可以将其称为“盲”插值方法（blind interpolation），因为它们面对所有RoPE隐藏维度没有做任何针对性的处理。而本次要讲解的YaRN，可将其归类为“有针对性的”插值方法，即对RoPE的不同维度做出不同处理。

6.2 NTK-by-parts（局部NTK）

关于RoPE中不同维度的波长，有如下结论：存在某些维度i，其波长 \lambda_{i} 大于在预训练期间看到的最大上下文长度L。也就是说：在训练期间，存在某一个维度，旋转一圈后超过了token最大上下文长度L。具体每个维度的波形可以参考图1-3，即Sin方法的绘图，其中 d=20,pos\in{[0,100]} 。

如果某些维度的波长大于上下文长度L（ \lambda_{i}&gt;L ），这说明该维度无法执行全旋转。在这种情况下，由于维度在预训练期间至少不会完全旋转一次，如果我们选择第一个token作为基准，那么在预训练期间每隔一个token到它的距离是唯一的，NTK可以用来确定它的绝对位置信息。
相反，如果某个维度波长小于L（ \lambda_{i}&lt;L ），那该维度就执行了至少一次全旋转，我们就无法在这个维度描述绝对距离，只能描述相对位置信息。

因此，作者认为，不要对『只编码相对位置信息的维度』（ \lambda_{i}&lt;L ）进行内插破坏，因为它们对于模型区分附近token的相对顺序至关重要。同时，应该始终对仅编码绝对位置信息的维度（ \lambda_{i}&gt;L ）进行内插，因为较大的距离将超出之前模型能够编码的距离。综上，可以制定一种考虑以上所有因素的显式且有针对性的插值方法，即：

如果波长远小于L，此时编码了相对位置的维度，因此不进行内插；
如果波长大于L，此时编码了绝对位置的维度，应该进行内插以防止超出绝对位置的最大可编码范围；
波长介于上述之间的维度，采用NTK-aware方法。

在实际使用过程中，为了实现该公式，只需要将m位置和n位置的旋转位置嵌入各自缩放为原来的 1/\sqrt{t} 即可。

6.4 Dynamic NTK

在NTK中 S=\frac{L&#x27;}{L} ，在推理时，这里的 S 是固定的（ L&#x27; 是固定的扩展上下文大小， L 是预训练时候的最大上下文长度）。但是，这可能导致推理的序列长度 &lt;L 时会损失模型性能。

因此，作者提出了动态的NTK，公式为 \color{blue} {S=\max({1,{l&#x27;/L}})} ，其中 l&#x27; 为当前输入的长度，这就允许模型在达到训练的上下文限制时较为缓慢地退化性能，避免了骤降。

view-handbook/_next/static/chunks/14mrh2-p_w84d.js\",\"/review-handbook/_next/static/chunks/0nn2k6-01tx8b.js\"],\"default\"]\n14:T8ec,"])</script><script>self.__next_f.push([1,"## 来源\n- [xiaohongshu] [大模型激活函数为什么是swiGLU？](https://www.xiaohongshu.com/explore/6921761f000000001f0061d8)\n\n## 内容\n大模型FFN中激活函数的演进：ReLU → GELU → SiLU(Swish) → SwiGLU → GeGLU\n**GLU（Gated Linear Unit）家族**： GLU = (x·W₁ + b₁) ⊗ σ(x·W₂ + b₂)，即输入通过两个线性变换，一个做激活后与另一个逐元素相乘（门控）。不同GLU变体的区别在于激活函数σ的选择。\n- **SwiGLU**（LLaMA/Qwen/DeepSeek）：σ = SiLU(Swish) = x·σ(x)。门控用Swish代替sigmoid，平滑可导，梯度流动更好 - **GeGLU**：σ = GELU = x·Φ(x)（Φ是标准正态CDF），理论上更接近ReLU的统计特性 - **ReGLU**：σ = ReLU，最简单但非平滑 - **为什么用GLU**：相比标准FFN（2个权重矩阵），GLU用3个权重矩阵但保持参数量不变（通过调整hidden_dim），引入了门控机制使模型能选择性传递信息\n**为什么SwiGLU优于ReLU**： 1. 平滑性：处处可导，优化更稳定 2. 非单调：允许小的负值通过，防止神经元\"死亡\" 3. 门控机制：动态控制信息流，增强表达能力 4. 实证结果：LLaMA论文中SwiGLU在perplexity上显著优于ReLU 5. 梯度：SiLU的梯度在正值区域保持较大值，缓解梯度消失\n\n\n## 关键要点\n- SwiGLU = Swish(xW_gate) ⊗ (xW_up)，然后down_proj\n- GLU参数量计算：3×d_model×d_ff（vs 标准FFN的2×d_model×d_ff），通过调整d_ff保持总参数量一致\n- {'GELU': 'x·Φ(x) ≈ 0.5x(1+tanh(√(2/π)(x+0.044715x³)))'}\n- {'SiLU/Swish': 'x·σ(x)，与GELU形状相似但计算更简单'}\n- {'LLaMA中实际使用': 'SwiGLU + d_ff = 8/3 × d_model（补偿3个权重矩阵）'}\n- 对比：ReLU(d_ff=4d) vs SwiGLU(d_ff≈2.7d)，参数量等效\n\n## 自测问题\n- SwiGLU的门控机制为什么有效？从梯度和表达能力的角度分析\n- GeGLU vs SwiGLU vs ReGLU的对比，为什么SwiGLU最流行？\n- FFN中用GLU后参数量如何保持与标准FFN一致？\n\n## 图片\n![SwiGLU激活函数原理图](http://sns-webpic-qc.xhscdn.com/202606222257/fd92c98c779ae534ffbe50ebf2b58a4f/1040g2sg31p6brbn6jcgg5nvg187g8477mc261m8!nc_n_webp_mw_1)\n*SwiGLU激活函数原理图*\n\n## 相关笔记\n- [[qa-week02-swiglu]]\n- [[fnd-week02-norm]]"])</script><script>self.__next_f.push([1,"15:Ta36,"])</script><script>self.__next_f.push([1,"## 来源\n- [xiaohongshu] [大模型NLP面试题：LLaMA模型结构](https://www.xiaohongshu.com/explore/650c5d97000000001f00701d)\n\n## 内容\n归一化（Normalization）技术是Transformer训练稳定性的关键。演进路线：\n**1. BatchNorm → LayerNorm**： - BatchNorm沿batch维度归一化，不适用于变长序列和batch size小的场景 - LayerNorm沿feature维度归一化，独立于batch size，适合NLP\n**2. LayerNorm → RMSNorm**（LLaMA）： - RMSNorm只计算均方根（RMS），去掉了均值中心化 - RMSNorm(x) = x / RMS(x) · γ，其中RMS=√(mean(x²)) - 计算量约为LayerNorm的60-70%，效果相当 - 几乎所有现代LLM（LLaMA/Mistral/Qwen/DeepSeek）都用RMSNorm\n**3. DeepNorm**（DeepNet，千层Transformer）： - 在残差连接前对输入做缩放：x + α·Sublayer(LN(x)) - 初始化时α\u003c1，控制残差方差 - 使1000+层Transformer稳定训练成为可能\n**4. Pre-LN vs Post-LN**： - Post-LN（原始Transformer）：x + LN(Sublayer(x))，梯度容易发散 - Pre-LN（现代Transformer）：x + Sublayer(LN(x))，梯度流经残差直接传播 - 几乎所有现代LLM使用Pre-LN（实际上Pre-RMSNorm + Residual）\n**5. 其他归一化技术**： - QK Norm（Gemma/某些VLM）：对Q、K单独做LayerNorm，防止attention logits过大 - Sandwich Norm（Pre+Post）：Pre-LN + Post-LN组合，一些大模型使用\n\n\n## 关键要点\n- {'LayerNorm': 'y = (x-μ)/σ · γ + β，两个统计量+两个可学习参数'}\n- {'RMSNorm': 'y = x/√(mean(x²)+ε) · γ，只有RMS统计量+一个可学习参数（无β bias）'}\n- RMSNorm去掉re-centering的原因：实证表明中心化对性能影响极小，去掉减少计算量\n- {'DeepNorm': 'x_{l+1} = x_l + α·F(LN(x_l))，α在初始化时\u003c1控制方差'}\n- Pre-LN优势：梯度从顶层通过残差直达底层，训练更稳定，允许更大学习率\n- {'QK Norm': '对Q和K的head维度做归一化，防止attention logits过大导致softmax饱和'}\n- 层归一化位置影响：Pre-LN对Sublayer输入做归一化，Post-LN对输出做归一化\n\n## 自测问题\n- RMSNorm相比LayerNorm去掉了什么？为什么不影响性能？\n- Pre-LN vs Post-LN的训练稳定性差异的根本原因？\n- DeepNorm如何解决千层Transformer的训练问题？\n- QK Norm的使用场景？什么时候需要？\n\n## 图片\n![LLaMA结构中的RMSNorm](http://sns-webpic-qc.xhscdn.com/202606222257/07c548f48af47a52f60cddafcf98c8df/1040g00830p9old0ojs005n1f8vhhntdmqgeebuo!nc_n_webp_mw_1)\n*LLaMA结构中的RMSNorm*\n\n## 相关笔记\n- [[fnd-week02-activation]]\n- [[fnd-week01-transformer-block]]"])</script><script>self.__next_f.push([1,"16:T266c,"])</script><script>self.__next_f.push([1,"\u003e 作者: 苏剑林 | 来源: https://zhuanlan.zhihu.com/p/1958228593369921194\n\n---\n\n最佳排版请看原博客：\n\n前两篇文章《重新思考学习率与Batch Size（一）：现状》和《重新思考学习率与Batch Size（二）：平均场》中，我们主要是提出了平均场方法，用以简化学习率与Batch Size的相关计算。当时我们分析的优化器是SGD、SignSGD和SoftSignSGD，并且主要目的是简化，本质上没有新的结论。\n\n然而，在如今的优化器盛宴中，怎能少得了Muon的一席之地呢？所以，这篇文章我们就来尝试计算Muon的相关结论，看看它的学习率与Batch Size的关系是否会呈现出新的规律。\n\n基本记号\n\n众所周知，Muon的主要特点就是非Element-wise的更新规则，所以之前在《当Batch Size增大时，学习率该如何随之变化？》和《Adam的epsilon如何影响学习率的Scaling Law？》的Element-wise的计算方法将完全不可用。但幸运的是，上篇文章介绍的平均场依然好使，只需要稍微调整一下细节。\n\n我们先引入一些记号。设损失函数为\\mathcal{L}(\\boldsymbol{W})，\\boldsymbol{W}\\in\\mathbb{R}^{n\\times m}是矩阵向量（设n\\geq m），\\boldsymbol{G}是它的梯度，单个样本的梯度记为\\tilde{\\boldsymbol{G}}，它的均值就是\\boldsymbol{G}，而方差为\\sigma^2；当Batch Size为B时，梯度记为\\tilde{\\boldsymbol{G}}_B，它的均值还是\\boldsymbol{G}，但方差变为\\sigma^2/B。注意，这里的方差只是一个标量\\sigma^2，并不像之前那样考虑了完整的协方差矩阵。\n\n之所以这样简化，最核心的原因是这里的随机变量本身就已经是一个矩阵，那么它对应的协方差矩阵实际上已经是一个4阶张量，这讨论起来比较麻烦。那么简化为单个标量会严重损失准确性吗？其实不会，前两篇文章我们虽然考虑了完整的协方差矩阵\\boldsymbol{\\Sigma}，但仔细观察就会发现最后结果只依赖于\\mathop{\\text{tr}}(\\boldsymbol{\\Sigma})，这跟开始就将它简化为标量是等价的。\n\n海森矩阵\n\n类似地，我们设更新量为-\\eta\\tilde{\\boldsymbol{\\Phi}}_B，考虑损失函数的二阶展开\n\n\\mathcal{L}(\\boldsymbol{W} - \\eta\\tilde{\\boldsymbol{\\Phi}}_B) \\approx \\mathcal{L}(\\boldsymbol{W}) - \\eta \\mathop{\\text{tr}}(\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\boldsymbol{G}) + \\frac{1}{2}\\eta^2\\mathop{\\text{tr}}(\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\boldsymbol{H}\\tilde{\\boldsymbol{\\Phi}}_B)\\tag{1}\n\n前两项应该都没什么疑问，比较难理解的第三项。跟协方差矩阵类似，这里的Hessian矩阵\\boldsymbol{H}是一个4阶张量，理解起来比较麻烦。\n\n这里最简单的切入方式应该是线性算子视角，即将\\boldsymbol{H}理解为一个输入输出都是矩阵的线性算子。我们不用知道\\boldsymbol{H}长什么样，也不用知道\\boldsymbol{H}与\\tilde{\\boldsymbol{\\Phi}}_B怎么运算，只需要知道\\boldsymbol{H}\\tilde{\\boldsymbol{\\Phi}}_B关于\\tilde{\\boldsymbol{\\Phi}}_B是线性的。这样一来，我们要处理的对象依然还是矩阵，不需要增加心智负担。任何符合条件的线性算子，都可以作为Hessian矩阵的近似，但不需要写出具体的高阶张量形式。\n\n本文的主角是Muon，我们取\\tilde{\\boldsymbol{\\Phi}}_B=\\mathop{\\text{msign}}(\\tilde{\\boldsymbol{G}}_B)作为它的近似来进行计算。根据定义，我们写出\\mathop{\\text{msign}}(\\tilde{\\boldsymbol{G}}_B)=\\tilde{\\boldsymbol{G}}_B(\\tilde{\\boldsymbol{G}}{}_B^{\\top}\\tilde{\\boldsymbol{G}}_B)^{-1/2}，从牛顿法视角看，这相当于假设\\boldsymbol{H}^{-1}\\boldsymbol{X} = \\eta_{\\max}\\boldsymbol{X}(\\boldsymbol{G}^{\\top}\\boldsymbol{G})^{-1/2}，于是有\\boldsymbol{H}\\boldsymbol{X} = \\eta_{\\max}^{-1}\\boldsymbol{X}(\\boldsymbol{G}^{\\top}\\boldsymbol{G})^{1/2}，这将用于后面的计算。\n\n计算期望\n\n对式(1)两边求期望，得到\n\n\\mathbb{E}[\\mathcal{L}(\\boldsymbol{W} - \\eta\\tilde{\\boldsymbol{\\Phi}}_B)] \\approx \\mathcal{L}(\\boldsymbol{W}) - \\eta \\mathop{\\text{tr}}(\\mathbb{E}[\\tilde{\\boldsymbol{\\Phi}}_B]^{\\top}\\boldsymbol{G}) + \\frac{1}{2}\\eta^2\\mathbb{E}[\\mathop{\\text{tr}}(\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\boldsymbol{H}\\tilde{\\boldsymbol{\\Phi}}_B)] \\\\\n\n先求\\mathbb{E}[\\tilde{\\boldsymbol{\\Phi}}_B]：\n\n\\mathbb{E}[\\tilde{\\boldsymbol{\\Phi}}_B]=\\mathbb{E}[\\tilde{\\boldsymbol{G}}_B(\\tilde{\\boldsymbol{G}}{}_B^{\\top}\\tilde{\\boldsymbol{G}}_B)^{-1/2}]\\approx\\mathbb{E}[\\tilde{\\boldsymbol{G}}_B](\\mathbb{E}[\\tilde{\\boldsymbol{G}}{}_B^{\\top}\\tilde{\\boldsymbol{G}}_B])^{-1/2} = \\boldsymbol{G}(\\mathbb{E}[\\tilde{\\boldsymbol{G}}{}_B^{\\top}\\tilde{\\boldsymbol{G}}_B])^{-1/2} \\\\\n\n\\mathbb{E}[\\tilde{\\boldsymbol{G}}{}_B^{\\top}\\tilde{\\boldsymbol{G}}_B]我们按分量写出来，并且假设不同分量之间独立，那么\n\n\\mathbb{E}[\\tilde{\\boldsymbol{G}}{}_B^{\\top}\\tilde{\\boldsymbol{G}}_B]_{i,j} = \\mathbb{E}\\left[\\sum_{k=1}^n (\\tilde{G}_B)_{k,i}(\\tilde{G}_B)_{k,j}\\right] = \\left\\{\\begin{aligned} \\mathbb{E}\\left[\\sum_{k=1}^n (\\tilde{G}_B)_{k,i}^2\\right] = \\left(\\sum_{k=1}^n G_{k,i}^2\\right) + n\\sigma^2/B,\\quad (i=j) \\\\[6pt] \\sum_{k=1}^n \\mathbb{E}[(\\tilde{G}_B)_{k,i}] \\mathbb{E}[(\\tilde{G}_B)_{k,j}] = \\sum_{k=1}^n G_{k,i}G_{k,j},\\quad (i\\neq j) \\end{aligned}\\right.\\\\\n\n组合起来就是\\mathbb{E}[\\tilde{\\boldsymbol{G}}{}_B^{\\top}\\tilde{\\boldsymbol{G}}_B]=\\boldsymbol{G}^{\\top}\\boldsymbol{G} + (n\\sigma^2/B) \\boldsymbol{I}，所以\n\n\\mathbb{E}[\\tilde{\\boldsymbol{\\Phi}}_B]\\approx \\boldsymbol{G}(\\boldsymbol{G}^{\\top}\\boldsymbol{G} + (n\\sigma^2/B) \\boldsymbol{I})^{-1/2} = \\mathop{\\text{msign}}(\\boldsymbol{G})(\\boldsymbol{I} + (n\\sigma^2/B) (\\boldsymbol{G}^{\\top}\\boldsymbol{G})^{-1})^{-1/2} \\\\\n\n为了进一步简化B的依赖形式，我们用\\mathop{\\text{tr}}(\\boldsymbol{G}^{\\top}\\boldsymbol{G})\\boldsymbol{I}/m近似\\boldsymbol{G}^{\\top}\\boldsymbol{G}，也就是只保留\\boldsymbol{G}^{\\top}\\boldsymbol{G}的对角线部分，然后再降对角线部分替换成它们的平均。这样一来，我们得到\n\n\\mathbb{E}[\\tilde{\\boldsymbol{\\Phi}}_B]\\approx \\mathop{\\text{msign}}(\\boldsymbol{G})(1 + \\mathcal{B}_{\\text{simple}}/B)^{-1/2} \\\\\n\n其中\\mathcal{B}_{\\text{simple}} = mn\\sigma^2/\\mathop{\\text{tr}}(\\boldsymbol{G}^{\\top}\\boldsymbol{G})= mn\\sigma^2/\\Vert\\boldsymbol{G}\\Vert_F，这其实跟把\\boldsymbol{G}当成向量，算前两篇文章的\\mathcal{B}_{\\text{simple}}是一样的。上式的形式跟SignSGD如出一辙，由此我们可以猜测，Muon在学习率与Batch Size的关系上不会有太多新鲜结果。\n\n相同规律\n\n至于\\mathbb{E}[\\mathop{\\text{tr}}(\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\boldsymbol{H}\\tilde{\\boldsymbol{\\Phi}}_B)]，我们只计算刚才推出的Muon对应的假设，即\\boldsymbol{H}\\boldsymbol{X} = \\eta_{\\max}^{-1}\\boldsymbol{X}(\\boldsymbol{G}^{\\top}\\boldsymbol{G})^{1/2}，那么\n\n\\mathop{\\text{tr}}(\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\boldsymbol{H}\\tilde{\\boldsymbol{\\Phi}}_B) = \\eta_{\\max}^{-1}\\mathop{\\text{tr}}(\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\tilde{\\boldsymbol{\\Phi}}_B(\\boldsymbol{G}^{\\top}\\boldsymbol{G})^{1/2}) \\\\\n\n留意到\\tilde{\\boldsymbol{\\Phi}}_B是\\mathop{\\text{msign}}的结果，它一定是正交矩阵（满秩），所以\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\tilde{\\boldsymbol{\\Phi}}_B=\\boldsymbol{I}，即在这个case下\\mathop{\\text{tr}}(\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\boldsymbol{H}\\tilde{\\boldsymbol{\\Phi}}_B)是一个确定的常数\\eta_{\\max}^{-1}\\mathop{\\text{tr}}((\\boldsymbol{G}^{\\top}\\boldsymbol{G})^{1/2})=\\eta_{\\max}^{-1}\\mathop{\\text{msign}}(\\boldsymbol{G})^{\\top}\\boldsymbol{G}，于是我们可以得到\n\n\\eta^* \\approx \\frac{\\mathop{\\text{tr}}(\\mathbb{E}[\\tilde{\\boldsymbol{\\Phi}}_B]^{\\top}\\boldsymbol{G})}{\\mathbb{E}[\\mathop{\\text{tr}}(\\tilde{\\boldsymbol{\\Phi}}{}_B^{\\top}\\boldsymbol{H}\\tilde{\\boldsymbol{\\Phi}}_B)]}\\approx \\frac{\\eta_{\\max}}{\\sqrt{1 + \\mathcal{B}_{\\text{simple}}/B}} \\\\\n\n果不其然，它跟SignSGD结果的形式完全一样，没有什么新鲜规律。\n\n其实仔细想想就会发现这也是情理之中，因为SignSGD是直接对梯度加\\mathop{\\text{sign}}，而Muon的\\mathop{\\text{msign}}则是给奇异值加\\mathop{\\text{sign}}，直觉上就相当于换了个坐标系加\\mathop{\\text{sign}}，它带来的是新的矩阵更新规则，而学习率\\eta^*和Batch Size B只是一个标量，在大家背后核心都是\\mathop{\\text{sign}}的前提下，这些标量的渐近关系极有可能不会发现明显变化。\n\n当然，我们现在只算了一个特殊的\\boldsymbol{H}，如果考虑更一般的\\boldsymbol{H}，那么也有可能跟SignSGD一样出现“Batch Size增大，学习率反而应该减少”的Surge现象。但正如我们在上一篇文章的“原因反思”一节说的，如果真观察到Surge现象了，也许更应该要更换优化器，而不是修正\\eta^*与B的关系。\n\n文章小结\n\n这篇文章我们尝试用平均场近似对Muon进行了简单分析，结论是它学习率与Batch Size的关系跟SignSGD一致，并无新鲜规律。\n\n\n## 图片\n\n![图片](https://pic1.zhimg.com/v2-ddf658f2e6ef81ef4a5c8a6a53e2abf9_l.jpg?source=32738c0c\u0026needBackground=1)\n\n![图片](https://picx.zhimg.com/v2-6558ca50578916708daa98779d79d86f_l.jpg?source=32738c0c\u0026needBackground=1)\n\n![图片](https://picx.zhimg.com/v2-4a07bc69c4bb04444721f35b32125c75_l.png?source=32738c0c)\n\n![图片](https://picx.zhimg.com/v2-c5be1695771c4f9b442b5bde56e5e8e0_720w.jpg?source=172ae18b)\n\n![图片](https://pic1.zhimg.com/v2-6558ca50578916708daa98779d79d86f_l.jpg?source=172ae18b)\n\n![图片](https://pic1.zhimg.com/v2-4a07bc69c4bb04444721f35b32125c75_l.png?source=32738c0c)\n\n![图片](https://picx.zhimg.com/v2-25c9966d55d8c293a5c55bb43d323141.webp?source=7e7ef6e2\u0026needBackground=1)\n\n![图片](https://pic4.zhimg.com/v2-e96a4bab27e85a39f1d74582cf1c0c61.webp)"])</script><script>self.__next_f.push([1,"17:T2d8d,"])</script><script>self.__next_f.push([1,"\u003e 作者: 假如给我一只AI | 来源: https://zhuanlan.zhihu.com/p/1894384438206505105\n\n---\n\n前言：假期翻看了一年前总结的有关位置编码的笔记，发现在某些角度上有了新的理解，本次也分享出来。本文讲解的顺序是：SIN-\u003eALiBi-\u003eRoPE-\u003ePI-\u003eNTK-\u003eYARN，公式较多，建议pc端食用。\n\n一、SIN（正弦位置编码）\n图1-1：正弦位置编码形式的由来\n图1-2：正弦位置编码中θ的由来\n图1-3：正弦位置编码的特点+推导\n\n缺点：sin位置编码表示相对位置关系时仍然比较间接。\n\n二、ALiBi（Attention with Linear Biases）\n\n思路：ALiBi（基于线性偏差的注意力机制） 不向word embedding中添加positional embedding，而是\"根据token之间的距离给 attention score 加上一个预设好的偏置矩阵\"，即直接引入相对位置。\n\n举例：两个token之间存在一个相对位置差1，就加上一个 -1 的偏置，如果token之间的距离越远则这个负数就越大，代表它们之间的相关性更低。\n\n图2-1：ALiBi如何引入MHA中\n图2-2：ALiBi的示例代码和结果\n三、RoPE（Rotary Position Embedding）\n\n2021年，RoPE（旋转位置编码）诞生，它借助了复数的思想，出发点是通过绝对位置编码的方式实现相对位置编码。\n\n设计思路：在NLP中，通常会通过向量q和k的内积来计算注意力系数（ATTN），如果能够对q、k向量注入位置信息，然后用更新的q、k向量做内积就能丝滑地引入位置信息了。\n\n图3-1：RoPE的两种解释（左：直观解释，右：原始推导）\n图3-2：RoPE的操作示意图\n\n在transformer模型中RoPE如何使用：\n\n\nq = x @ Wq  # [batch_size, seq_len, d_model] -\u003e [batch_size, seq_len, d_head]\nk = x @ Wk\n\n\nq_rotated = apply_rotary_pos_emb(q, position_ids)\nk_rotated = apply_rotary_pos_emb(k, position_ids)\n\ndef apply_rotary_pos_emb(q, position_ids):\n    # q shape: [batch_size, seq_len, dim]\n    seq_len = q.shape[1]\n    dim = q.shape[2]\n    # 生成位置编码的角度\n    theta = 1.0 / (10000 ** (torch.arange(0, dim, 2).float() / dim))\n    # 计算每个位置的旋转角度\n    pos_emb = position_ids.unsqueeze(-1) * theta\n    # 生成cos和sin值\n    cos = torch.cos(pos_emb)\n    sin = torch.sin(pos_emb)\n    # 将q分成两半，便于旋转操作\n    q_even = q[:, :, 0::2]  # 偶数维度\n    q_odd = q[:, :, 1::2]   # 奇数维度\n    # 应用旋转变换\n    q_out_even = q_even * cos - q_odd * sin\n    q_out_odd = q_odd * cos + q_even * sin\n    # 重新组合\n    q_out = torch.stack([q_out_even, q_out_odd], dim=-1)\n    q_out = q_out.flatten(-2)\n    return q_out\n四、PI（Position Interpolation）\n\nPI（位置插值）是基于旋转位置编码RoPE进行改进，优化了外推性的问题：使用RoPE，以长度为L训练完成模型后，当输入超过L会发生性能剧烈下降，一些论文提出可以通过给模型喂一些长度大于L的输入来微调模型，进而逐步将原始窗口长度扩大，但其代价和成效不佳（实验结果如下图4-1）。\n\n图4-1：以微调来提升上下文窗口的实验\n\n思路：将超出L部分编码值压缩到L内。\n\n图4-2：PI思路+公式+外推性证明\n\n注意：上图4-2中，外推bound的计算是用了aber变换，完整证明见原论文。\n\n论文针对外推（Extrapolation）和内插（ interpolation），也给出了一些实验，见图4-3：\n\n图4-3：外推和内插的可视化实验\n\n图4-3的实验代码如下：\n\nimport torch\nimport matplotlib.pyplot as plt\n\n\nd = 4096 // 32\ntheta = 10000\n\nfreqs = 1.0 / (theta ** (torch.arange(0, d, 2).float() / d))\n\nL = 2048\nx = torch.arange(0, L)\n\nxfreq = torch.outer(x, freqs)\nprint(xfreq.shape)\ny = torch.randn(x.shape[0])\n\nX = torch.cat([xfreq.sin(), xfreq.cos()], dim=1)\n\neps = 1e-5  # small regularization term\n\ncoeffs = torch.linalg.solve(X.t() @ X + torch.eye(X.shape[1]) * eps, X.t() @ y)\n\nx2 = torch.arange(0, 2*L)\nxfreq2 = torch.outer(x2, freqs)\nX2 = torch.cat([xfreq2.sin(), xfreq2.cos()], dim=1)\ny2 = X2 @ coeffs\n\nx3 = torch.arange(25, 75, 0.125)\nxfreq3 = torch.outer(x3, freqs)\nX3 = torch.cat([xfreq3.sin(), xfreq3.cos()], dim=1)\ny3 = X3 @ coeffs\n\nplt.figure(figsize=(16, 5))\n\nplt.subplot(1, 3, 1)\nplt.plot(x2[:L], y2[:L], \"r\")\nplt.scatter(x, y)\nplt.ylabel(\"attention score $a(s)$\")\nplt.xlabel(\"Positional difference $s$\")\n\nplt.subplot(1, 3, 2)\nplt.plot(x2, y2, \"r\")\nplt.scatter(x, y)\nplt.axvline(L, color=\"k\", linestyle=\"--\", linewidth=0.5)\nplt.title(\"Effect of Extrapolation\")\nplt.xlabel(\"Positional difference $s$\")\n\nplt.subplot(1, 3, 3)\nplt.plot(x3, y3, \"r\")\nfor i in range(25, 75):\n    plt.axvline(i, color=\"k\", linestyle=\"--\", linewidth=0.5)\nplt.title(\"Effect of Interpolation\")\nplt.xlabel(\"Positional difference $s$\")\nplt.savefig('PI.png',dpi=300, bbox_inches='tight')\n\n五、NTK（Neural Tangent Kernel）\n\n现状：PI会在扩展倍数特别大时显著降低位置编码区分不同位置的能力，这种现象称之为高频信息的损失。\n\n图5-1：PI的缺点和问题所在\n\nNTK（Neural Tangent Kernel）的思想：高频外推+低频内插，即将 \\color{blue}{\\theta_{i}=b^{-2i/d}改为\\theta_{i}=(b\\cdot S^{d/(d-2)})^{-2i/d}}，也就是改变了基底（这里b=10000， \\color{blue}{S=L'/L} ）。推导见图5-2和图5-3：\n\n图5-2：NTK推导1——位置编码的本质是求位置n的β进制数\n图5-3：NTK推导2——统一高频外推和低频内插\n\n在代码上修改很小，如下11行：\n\nfrom transformers import AutoModelForCausalLM, AutoTokenizer, GenerationConfig\nimport torch\nimport transformers\n\nold_init = transformers.models.llama.modeling_llama.LlamaRotaryEmbedding.__init__\ndef ntk_scaled_init(self, dim, max_position_embeddings=2048, base=10000, device=None):\n    #The method is just these three lines\n    max_position_embeddings = 16384\n    a = 8 #Alpha value\n    base = base * a ** (dim / (dim-2)) #Base change formula # NTK-Aware\n    old_init(self, dim, max_position_embeddings, base, device)\ntransformers.models.llama.modeling_llama.LlamaRotaryEmbedding.__init__ = ntk_scaled_init\n六、YARN（Yet another RoPE extensioN method）\n6.1 波长的引入\n\n在某个维度i下，波长被定义为： \\lambda_{i}=\\frac{2π}{\\theta_{i}}=\\frac{2\\pi}{b^{-2i/d}}=2\\pi b^{2i/d} ，因此，有如下结论：\n\n波长可描述为：在维度i处嵌入的旋转位置执行全旋转2π所需的token长度。\n维度越高波长越长。\n\n证明见下图6-1：\n\n图6-1：波长描述了维度i处执行全旋转2π所需的token长度\n\n像PI和NTK这种类型的插值方案不关心波长的维数，可以将其称为“盲”插值方法（blind interpolation），因为它们面对所有RoPE隐藏维度没有做任何针对性的处理。而本次要讲解的YaRN，可将其归类为“有针对性的”插值方法，即对RoPE的不同维度做出不同处理。\n\n6.2 NTK-by-parts（局部NTK）\n\n关于RoPE中不同维度的波长，有如下结论：存在某些维度i，其波长 \\lambda_{i} 大于在预训练期间看到的最大上下文长度L。也就是说：在训练期间，存在某一个维度，旋转一圈后超过了token最大上下文长度L。具体每个维度的波形可以参考图1-3，即Sin方法的绘图，其中 d=20,pos\\in{[0,100]} 。\n\n如果某些维度的波长大于上下文长度L（ \\lambda_{i}\u003eL ），这说明该维度无法执行全旋转。在这种情况下，由于维度在预训练期间至少不会完全旋转一次，如果我们选择第一个token作为基准，那么在预训练期间每隔一个token到它的距离是唯一的，NTK可以用来确定它的绝对位置信息。\n相反，如果某个维度波长小于L（ \\lambda_{i}\u003cL ），那该维度就执行了至少一次全旋转，我们就无法在这个维度描述绝对距离，只能描述相对位置信息。\n\n因此，作者认为，不要对『只编码相对位置信息的维度』（ \\lambda_{i}\u003cL ）进行内插破坏，因为它们对于模型区分附近token的相对顺序至关重要。同时，应该始终对仅编码绝对位置信息的维度（ \\lambda_{i}\u003eL ）进行内插，因为较大的距离将超出之前模型能够编码的距离。综上，可以制定一种考虑以上所有因素的显式且有针对性的插值方法，即：\n\n如果波长远小于L，此时编码了相对位置的维度，因此不进行内插；\n如果波长大于L，此时编码了绝对位置的维度，应该进行内插以防止超出绝对位置的最大可编码范围；\n波长介于上述之间的维度，采用NTK-aware方法。\n\n公式如下：\n\n图6-2：NTK-by-parts公式\n6.3 YARN\n图6-3：YARN的提出\n\n在实际使用过程中，为了实现该公式，只需要将m位置和n位置的旋转位置嵌入各自缩放为原来的 1/\\sqrt{t} 即可。\n\n6.4 Dynamic NTK\n\n在NTK中 S=\\frac{L'}{L} ，在推理时，这里的 S 是固定的（ L' 是固定的扩展上下文大小， L 是预训练时候的最大上下文长度）。但是，这可能导致推理的序列长度 \u003cL 时会损失模型性能。\n\n因此，作者提出了动态的NTK，公式为 \\color{blue} {S=\\max({1,{l'/L}})} ，其中 l' 为当前输入的长度，这就允许模型在达到训练的上下文限制时较为缓慢地退化性能，避免了骤降。\n\n如果不好理解，进一步解释分析如下：\n\n图6-4：Dynamic NTK的分析和公式解释\n七、总结\n图7-1：六种位置编码方法总结\n八、参考文献\nSIN：https://arxiv.org/pdf/1706.03762\nRoPE：https://arxiv.org/pdf/2104.09864\nALiBi：https://arxiv.org/pdf/2108.12409\nPI：https://arxiv.org/pdf/2306.15595\nLinsight：理解LLM位置编码:RoPE\nbarely：上下文长度扩展：从RoPE到YARN\nhttps://www.reddit.com/r/LocalLLaMA/comments/14lz7j5/ntkaware_scaled_rope_allows_llama_models_to_have/, https://zhuanlan.zhihu.com/p/704569344\nCyril-KI：LLM上下文长度扩展方案：NTK-aware interpolation\nhttps://zhuanlan.zhihu.com/p/897061302,\nYARN：https://arxiv.org/pdf/2309.00071\n\n\n## 图片\n\n![图片](https://picx.zhimg.com/v2-ddf658f2e6ef81ef4a5c8a6a53e2abf9_l.jpg?source=32738c0c\u0026needBackground=1)\n\n![图片](https://picx.zhimg.com/v2-3f2dfd33c820cfa09975120d579b85c4_l.jpg?source=32738c0c\u0026needBackground=1)\n\n![图片](https://pic4.zhimg.com/v2-87e557d9f1c3c573cdc0285c8063328b_1440w.jpg)\n\n![图片](https://picx.zhimg.com/v2-759b3265a480c9a5e8eabeaf75dd2d91_1440w.jpg)\n\n![图片](https://pic2.zhimg.com/v2-4954ab00effae7a7bb7a45e0f3eb193d_1440w.jpg)\n\n![图片](https://pic3.zhimg.com/v2-4f6646bdb34518df14b06694bdd93d5e_1440w.jpg)\n\n![图片](https://pic2.zhimg.com/v2-738db622c55efef93d0cd6598eaa4c53_1440w.jpg)\n\n![图片](https://pic1.zhimg.com/v2-e8a81dcfd90ee6132babe37287c1e3a8_1440w.jpg)\n\n![图片](https://picx.zhimg.com/v2-b6ca4ba3ee000a58dfd44170505f318b_1440w.jpg)\n\n![图片](https://pic4.zhimg.com/v2-c5b556ceecc21dc53d58cb234f7ecf4f_1440w.jpg)\n\n![图片](https://pic4.zhimg.com/v2-a2cf85761195ec4b46ec034b390de90f_1440w.jpg)\n\n![图片](https://pica.zhimg.com/v2-f190a9f6e9caa9e5967f188867a2737c_1440w.jpg)\n\n![图片](https://pica.zhimg.com/v2-0042401122b54ec47ddb25125ddca6c6_1440w.jpg)\n\n![图片](https://pic2.zhimg.com/v2-eb637641a5c7539f4e181640155e612b_1440w.jpg)\n\n![图片](https://pica.zhimg.com/v2-bc9f37aadf9e341075edeb7b4919fb26_1440w.jpg)\n\n![图片](https://picx.zhimg.com/v2-e2c7950bb91c3fff488b7b24d461c9a3_1440w.jpg)\n\n![图片](https://pic4.zhimg.com/v2-f57ef8dcc2e3802ced0479ee67e2dd89_1440w.jpg)\n\n![图片](https://pica.zhimg.com/v2-4e69f966c75afcee308d6a3b055d2736_1440w.jpg)\n\n![图片](https://pic2.zhimg.com/v2-c5a773dfe062cfbe5698561b5535813b_1440w.jpg)\n\n![图片](https://picx.zhimg.com/v2-bbe84075b05db5377d1ce2ad65d20a1d_1440w.jpg)"])</script><script>self.__next_f.push([1,"18:T9eb,"])</script><script>self.__next_f.push([1,"## 来源\n- [xiaohongshu] [面试必备：旋转位置编码 RoPE](https://www.xiaohongshu.com/explore/695b6e5c000000001a030087)\n\n## 内容\n**位置编码演进路线**： 1. Sinusoidal（Transformer原始论文）：固定正弦编码，PE(pos,2i)=sin(pos/10000^(2i/d))。优点是不需要学习参数，有一定外推能力；缺点是相对位置信息隐含、不够灵活 2. Learned Positional Embedding（BERT/GPT）：可学习的位置向量，优点是灵活；缺点是无法处理超过训练长度的序列 3. RoPE（Rotary Position Embedding，LLaMA/Qwen/DeepSeek）：通过旋转矩阵将位置信息融入Q/K向量。核心公式：q_m = R^m·q，k_n = R^n·k，attention score = q_m^T·k_n = q^T·R^{n-m}·k，只依赖相对位置(n-m) 4. ALiBi（Attention with Linear Biases）：直接在attention score上加线性衰减偏置，(i-j)·m，简单有效 5. NoPE：最新研究发现，足够大的模型可以不使用显式位置编码\n**RoPE核心优点**： - 天然编码相对位置（attention score只依赖位置差） - 可以外推到训练时未见过的长度（通过NTK-aware scaling等方法） - 与线性attention兼容 - 代码实现简洁：构造旋转矩阵→对Q/K施加旋转\n\n\n## 关键要点\n- {'Sinusoidal': 'PE(pos,2i)=sin(pos/theta^(2i/d)), PE(pos,2i+1)=cos(pos/theta^(2i/d))'}\n- {'RoPE旋转矩阵': '将d维向量拆成d/2对2D向量，每对用位置m的旋转角m·theta_i进行旋转'}\n- {'RoPE的attention score内积': 'q^T·R^{n-m}·k，仅依赖相对位置差(n-m)'}\n- {'实现核心': 'precompute cos/sin频率表 → 对Q、K分别施加旋转 → 计算attention'}\n- {'NTK-aware外推': '调整base频率(10000→更大值)让高频rotation更稀疏，支持更长序列'}\n- {'YaRN方法': '结合NTK-aware scaling + temperature tuning，是目前最优的RoPE外推方案'}\n- {'ALiBi优势': '无额外参数、训练推理一致、天然支持任意长度'}\n\n## 自测问题\n- RoPE的数学推导：为什么旋转后内积只依赖相对位置？\n- RoPE相比Sinusoidal PE的优势是什么？为什么大模型几乎都用RoPE？\n- 如何将RoPE推广到超出训练长度的序列？NTK-aware scaling的原理？\n- ALiBi为什么可以替代位置编码？其局限性是什么？\n\n## 图片\n![RoPE旋转位置编码原理图](http://sns-webpic-qc.xhscdn.com/202606222257/f6bf694b23b65e81c2cb3766df5c745f/spectrum/1040g0k031quvdpqb0m005opl5ifmbnrodc3emlo!nc_n_webp_mw_1)\n*RoPE旋转位置编码原理图*\n\n## 相关笔记\n- [[qa-week02-rope]]\n- [[fnd-week02-activation]]"])</script><script>self.__next_f.push([1,"19:T7bb,\u003e **💡 问题**: RoPE的复数旋转矩阵推导？为什么比Sinusoidal更适配长序列？\n\n## 来源\n- [xiaohongshu] [面试必备：旋转位置编码 RoPE](https://www.xiaohongshu.com/explore/695b6e5c000000001a030087)\n\n## 回答\n**RoPE数学推导（三步走）**：\nStep 1 — 旋转矩阵：在2D空间中，位置m的旋转矩阵为 R(m) = [[cos(mθ), -sin(mθ)], [sin(mθ), cos(mθ)]]\nStep 2 — 应用到d维：将d维向量拆成d/2对，(x₀,x₁)→(x₂,x₃)→...，每对用不同频率θ_i旋转。θ_i = 10000^(-2i/d)\nStep 3 — Attention Score：q_m^T k_n = (R^m q)^T (R^n k) = q^T R^{n-m} k，仅依赖相对位置差n-m\n**为什么RoPE比Sinusoidal更适合长序列**：\n1. 相对位置编码天然性：RoPE直接编码相对位置（n-m），Sinusoidal需要模型学习从绝对位置推导相对关系 2. 外推能力：通过调整频率基（base 10000 → 更大值），让高频旋转更稀疏，模型可以处理更长的序列。这是NTK-aware scaling的核心 3. 长距离衰减：RoPE的attention score随相对距离增加而自然衰减（高频分量的振荡破坏内积一致性） 4. 与线性Attention兼容：RoPE的旋转特性与Linear Attention的K^T V优先计算顺序兼容\n**RoPE外推方法**： - Linear Scaling：所有位置除以放大因子，简单但效果一般 - NTK-aware：放大base（10000→更大），高频不压缩，低频压缩 - YaRN：NTK-aware + temperature tuning，当前最优方案 - ReRoPE/CoCA：训练时用短序列，推理时用滑动窗口+全局position reset\n\n\n## 延伸思考\n- 为什么RoPE的低频分量需要压缩而高频不需要？\n- YaRN中Temperature如何帮助外推？\n- RoPE与ALiBi在长序列上的实际对比？\n\n## 图片\n![RoPE旋转矩阵推导](http://sns-webpic-qc.xhscdn.com/202606222257/f6bf694b23b65e81c2cb3766df5c745f/spectrum/1040g0k031quvdpqb0m005opl5ifmbnrodc3emlo!nc_n_webp_mw_1)\n*RoPE旋转矩阵推导*\n\n## 相关笔记\n- [[fnd-week02-pos-encoding]]1a:T75b,\u003e **💡 问题**: SwiGLU的门控机制为什么有效？相比ReLU/SiLU的梯度分析？\n\n## 来源\n- [xiaohongshu] [大模型激活函数为什么是swiGLU？](https://www.xiaohongshu.com/explore/6921761f000000001f0061d8)\n\n## 回答\n**SwiGLU = 门控线性单元 + Swish激活**。门控机制使网络可以动态决定哪些信息通过。\n**梯度分析**：\n1. ReLU: gradient = 1 if x\u003e0 else 0。问题：(a) 负半区梯度为0→神经元\"死亡\"；(b) 非平滑→优化不稳定\n2. GELU: gradient = Φ(x) + x·φ(x)（φ是标准正态PDF）。平滑但计算复杂，负半区有小梯度\n3. SiLU/Swish: gradient = σ(x) + x·σ(x)(1-σ(x))。形状与GELU相似，计算更简单，负半区有非零梯度（约-0.1~0）\n4. SwiGLU: 前向 = Swish(xW_gate) ⊗ (xW_up)。梯度学自门控的分量选择，且由于SiLU的平滑性，门控参数也能获得有效梯度\n**为什么有效（三个层面）**：\n- **选择性**：门控可以让FFN根据输入动态选择激活哪些特征维度，相当于输入相关的特征选择 - **梯度流动**：SiLU在负半区仍有非零梯度（min≈-0.1），消除了ReLU的死神经元问题 - **二阶优化**：平滑激活函数使Hessian矩阵更稳定，有利于Adam等自适应优化器\n**实验证据**（来自PaLM/GLaM/LLaMA论文）： - SwiGLU \u003e GeGLU ≈ ReGLU \u003e ReLU - 在perplexity上SwiGLU比标准ReLU-FFN提升约2-5% - 同等参数量下，SwiGLU的效果显著更好\n\n\n## 延伸思考\n- GLU门控中gate和up两个分支的不同初始化策略？\n- 为什么不直接用Attention的门控机制代替GLU？\n- 门控机制是否增加了过拟合风险？\n\n## 图片\n![SwiGLU vs ReLU 对比](http://sns-webpic-qc.xhscdn.com/202606222257/fd92c98c779ae534ffbe50ebf2b58a4f/1040g2sg31p6brbn6jcgg5nvg187g8477mc261m8!nc_n_webp_mw_1)\n*SwiGLU vs ReLU 对比*\n\n## 相关笔记\n- [[fnd-week02-activation]]1b:T5ce0,"])</script><script>self.__next_f.push([1,"\u003e 作者: 苏剑林 | 来源: https://zhuanlan.zhihu.com/p/13401683661\n\n---\n\n最佳排版请看原博客：\n\n随着LLM时代的到来，学术界对于优化器的研究热情似乎有所减退。这主要是因为目前主流的AdamW已经能够满足大多数需求，而如果对优化器“大动干戈”，那么需要巨大的验证成本。因此，当前优化器的变化，多数都只是工业界根据自己的训练经验来对AdamW打的一些小补丁。\n\n不过，最近推特上一个名为“Muon”的优化器颇为热闹，它声称比AdamW更为高效，且并不只是在Adam基础上的“小打小闹”，而是体现了关于向量与矩阵差异的一些值得深思的原理。本文让我们一起赏析一番。\n\n\n\n\n\n\n\n算法初探\n\nMuon全称是“MomentUm Orthogonalized by Newton-schulz”，它适用于矩阵参数\\boldsymbol{W}\\in\\mathbb{R}^{n\\times m}，其更新规则是\n\n\\begin{aligned} \\boldsymbol{M}_t =\u0026\\, \\beta\\boldsymbol{M}_{t-1} + \\boldsymbol{G}_t \\\\[5pt] \\boldsymbol{W}_t =\u0026\\, \\boldsymbol{W}_{t-1} - \\eta_t [\\text{msign}(\\boldsymbol{M}_t) + \\lambda \\boldsymbol{W}_{t-1}] \\\\ \\end{aligned}\\\\\n\n这里\\text{msign}是矩阵符号函数，它并不是简单地对矩阵每个分量取\\text{sign}操作，而是\\text{sign}函数的矩阵化推广，它跟SVD的关系是：\n\n\\boldsymbol{U},\\boldsymbol{\\Sigma},\\boldsymbol{V}^{\\top} = SVD(\\boldsymbol{M}) \\quad\\Rightarrow\\quad \\text{msign}(\\boldsymbol{M}) = \\boldsymbol{U}_{[:,:r]}\\boldsymbol{V}_{[:,:r]}^{\\top} \\\\\n\n其中\\boldsymbol{U}\\in\\mathbb{R}^{n\\times n},\\boldsymbol{\\Sigma}\\in\\mathbb{R}^{n\\times r},\\boldsymbol{V}\\in\\mathbb{R}^{m\\times m}，r是\\boldsymbol{M}的秩。更多的理论细节我们稍后再展开，这里我们先来尝试直观感知如下事实：\n\nMuon是一个类似于Adam的自适应学习率优化器。\n\n\n\n\n像Adagrad、RMSprop、Adam等自适应学习率优化器的特点是通过除以梯度平方的滑动平均的平方根来调整每个参数的更新量，这达到了两个效果：1、损失函数的常数缩放不影响优化轨迹；2、每个参数分量的更新幅度尽可能一致。Muon正好满足这两个特性：\n\n1、损失函数乘以\\lambda，\\boldsymbol{M}也会乘以\\lambda，结果是\\boldsymbol{\\Sigma}被乘以\\lambda，但Muon最后的更新量是将\\boldsymbol{\\Sigma}变为单位阵，所以不影响优化结果；\n2、当\\boldsymbol{M}被SVD为\\boldsymbol{U}\\boldsymbol{\\Sigma}\\boldsymbol{V}^{\\top}时，\\boldsymbol{\\Sigma}的不同奇异值体现了\\boldsymbol{M}的“各向异性”，而将它们都置一则更加各向同性，也起到同步更新幅度的作用。\n\n\n\n\n（注：Muon还有个Nesterov版，它只是将更新规则中的\\text{msign}(\\boldsymbol{M}_t)换成\\text{msign}(\\beta\\boldsymbol{M}_t + \\boldsymbol{G}_t)，其余部份完全一致，简单起见就不在正文中展开介绍了。）\n\n符号函数\n\n利用SVD，我们还可以证明恒等式\n\n\\text{msign}(\\boldsymbol{M}) = (\\boldsymbol{M}\\boldsymbol{M}^{\\top})^{-1/2}\\boldsymbol{M}= \\boldsymbol{M}(\\boldsymbol{M}^{\\top}\\boldsymbol{M})^{-1/2}\\label{eq:msign-id} \\\\\n\n其中{}^{-1/2}是矩阵的1/2次幂的逆矩阵，如果不可逆的话则取伪逆。这个恒等式能让我们更好理解为什么\\text{msign}是\\text{sign}的矩阵推广：对于标量x我们有\\text{sign}(x)=x(x^2)^{-1/2}，正是上式的一个特殊情形（当\\boldsymbol{M}是1\\times 1矩阵时）。这个特殊例子还可以推广到对角阵\\boldsymbol{M}=\\text{diag}(\\boldsymbol{m})：\n\n\\text{msign}(\\boldsymbol{M}) = \\text{diag}(\\boldsymbol{m})[\\text{diag}(\\boldsymbol{m})^2]^{-1/2} = \\text{diag}(\\text{sign}(\\boldsymbol{m}))=\\text{sign}(\\boldsymbol{M}) \\\\\n\n其中\\text{sign}(\\boldsymbol{m})、\\text{sign}(\\boldsymbol{M})是指向量/矩阵的每个分量都取\\text{sign}。上式意味着，当\\boldsymbol{M}是对角阵时，Muon就退化为带动量的SignSGD（Signum）或笔者所提的Tiger，它们都是Adam的经典近似。反过来说，Muon与Signum、Tiger的区别就是Element-wise的\\text{sign}(\\boldsymbol{M})替换成了矩阵版\\text{msign}(\\boldsymbol{M})。\n\n对于n维向量来说，我们还可以视为n\\times 1的矩阵，此时\\text{msign}(\\boldsymbol{m}) = \\boldsymbol{m}/\\Vert\\boldsymbol{m}\\Vert_2正好是l_2归一化。所以，在Muon框架下对向量我们有两种视角：一是对角矩阵，如LayerNorm的gamma参数，结果是对动量取\\text{sign}；二是n\\times 1的矩阵，结果是对动量做l_2归一化。此外，输入和输出的Embedding虽然也是矩阵，但它们使用上是稀疏的，所以更合理的方式也是将它们当成多个向量独立处理。\n\n当m=n=r时，\\text{msign}(\\boldsymbol{M})还有一个意义是“最优正交近似”：\n\n\\text{msign}(\\boldsymbol{M}) = \\mathop{\\text{argmin}}_{\\boldsymbol{O}^{\\top}\\boldsymbol{O} = \\boldsymbol{I}}\\Vert \\boldsymbol{M} - \\boldsymbol{O}\\Vert_F^2 \\label{eq:nearest-orth} \\\\\n\n类似地，对于\\text{sign}(\\boldsymbol{M})我们可以写出（假设\\boldsymbol{M}没有零元素）：\n\n\\text{sign}(\\boldsymbol{M}) = \\mathop{\\text{argmin}}_{\\boldsymbol{O}\\in\\{-1,1\\}^{n\\times m}}\\Vert \\boldsymbol{M} - \\boldsymbol{O}\\Vert_F^2 \\\\\n\n不论是\\boldsymbol{O}^{\\top}\\boldsymbol{O} = \\boldsymbol{I}还是\\boldsymbol{O}\\in\\{-1,1\\}^{n\\times m}，我们都可以视为对更新量的一种规整化约束，所以Muon和Signum、Tiger可以视作是同一思路下的优化器，它们都以动量\\boldsymbol{M}为出发点来构建更新量，只是为更新量选择了不同的规整化方法。\n\n式\\eqref{eq:nearest-orth}的证明：对于正交矩阵\\boldsymbol{O}，我们有\n\\begin{aligned} \\Vert \\boldsymbol{M} - \\boldsymbol{O}\\Vert_F^2 =\u0026\\, \\Vert \\boldsymbol{M}\\Vert_F^2 + \\Vert \\boldsymbol{O}\\Vert_F^2 - 2\\langle\\boldsymbol{M},\\boldsymbol{O}\\rangle_F \\\\[5pt] =\u0026\\, \\Vert \\boldsymbol{M}\\Vert_F^2 + n - 2\\text{Tr}(\\boldsymbol{M}\\boldsymbol{O}^{\\top})\\\\[5pt] =\u0026\\, \\Vert \\boldsymbol{M}\\Vert_F^2 + n - 2\\text{Tr}(\\boldsymbol{U}\\boldsymbol{\\Sigma}\\boldsymbol{V}^{\\top}\\boldsymbol{O}^{\\top})\\\\[5pt] =\u0026\\, \\Vert \\boldsymbol{M}\\Vert_F^2 + n - 2\\text{Tr}(\\boldsymbol{\\Sigma}\\boldsymbol{V}^{\\top}\\boldsymbol{O}^{\\top}\\boldsymbol{U})\\\\ =\u0026\\, \\Vert \\boldsymbol{M}\\Vert_F^2 + n - 2\\sum_{i=1}^n \\boldsymbol{\\Sigma}_{i,i}(\\boldsymbol{V}^{\\top}\\boldsymbol{O}^{\\top}\\boldsymbol{U})_{i,i} \\end{aligned}\\\\ 其中涉及到的运算规则我们在伪逆中已经介绍过。由于\\boldsymbol{U},\\boldsymbol{V},\\boldsymbol{O}都是正交矩阵，所以\\boldsymbol{V}^{\\top}\\boldsymbol{O}^{\\top}\\boldsymbol{U}也是正交矩阵，正交矩阵的每个分量必然不超过1，又因为\\boldsymbol{\\Sigma}_{i,i} \u003e 0，所以上式取最小值对应于每个(\\boldsymbol{V}^{\\top}\\boldsymbol{O}^{\\top}\\boldsymbol{U})_{i,i}取最大值，即(\\boldsymbol{V}^{\\top}\\boldsymbol{O}^{\\top}\\boldsymbol{U})_{i,i}=1，这意味着\\boldsymbol{V}^{\\top}\\boldsymbol{O}^{\\top}\\boldsymbol{U}=\\boldsymbol{I}，即\\boldsymbol{O}=\\boldsymbol{U}\\boldsymbol{V}^{\\top}。\n该结论还可以仔细地推广到m,n,r不相等的情形，但这里不作进一步展开。\n\n\n\n\n迭代求解\n\n实践中，如果每一步都对\\boldsymbol{M}做SVD来求解\\text{msign}(\\boldsymbol{M})的话，那么计算成本还是比较大的，因此作者提出了用Newton-schulz迭代来近似计算\\text{msign}(\\boldsymbol{M})。\n\n迭代的出发点是恒等式\\eqref{eq:msign-id}，不失一般性，我们假设n\\geq m，然后考虑在\\boldsymbol{M}^{\\top}\\boldsymbol{M}=\\boldsymbol{I}处泰勒展开(\\boldsymbol{M}^{\\top}\\boldsymbol{M})^{-1/2}，展开的方式是直接将标量函数t^{-1/2}的结果用到矩阵中：\n\nt^{-1/2} = 1 - \\frac{1}{2}(t-1) + \\frac{3}{8}(t-1)^2 - \\frac{5}{16}(t-1)^3 + \\cdots \\\\\n\n保留到二阶，结果是(15 - 10t + 3t^2)/8，那么我们有\n\n\\text{msign}(\\boldsymbol{M}) = \\boldsymbol{M}(\\boldsymbol{M}^{\\top}\\boldsymbol{M})^{-1/2}\\approx \\frac{15}{8}\\boldsymbol{M} - \\frac{5}{4}\\boldsymbol{M}(\\boldsymbol{M}^{\\top}\\boldsymbol{M}) + \\frac{3}{8}\\boldsymbol{M}(\\boldsymbol{M}^{\\top}\\boldsymbol{M})^2 \\\\\n\n假如\\boldsymbol{X}_t是\\text{msign}(\\boldsymbol{M})的某个近似，我们认为将它代入上式后，会得到\\text{msign}(\\boldsymbol{M})的一个更好的近似，于是我们得到一个可用的迭代格式\n\n\\boldsymbol{X}_{t+1} = \\frac{15}{8}\\boldsymbol{X}_t - \\frac{5}{4}\\boldsymbol{X}_t(\\boldsymbol{X}_t^{\\top}\\boldsymbol{X}_t) + \\frac{3}{8}\\boldsymbol{X}_t(\\boldsymbol{X}_t^{\\top}\\boldsymbol{X}_t)^2 \\\\\n\n然而，查看Muon的官方代码我们就会发现，它里边的Newton-schulz迭代确实是这个形式，但三个系数却是(3.4445, -4.7750, 2.0315)，而且作者没有给出数学推导，只有一段语焉不详的注释：\n\n\n\n\n收敛加速\n\n为了猜测官方迭代算法的来源，我们考虑一般的迭代过程\n\n\\boldsymbol{X}_{t+1} = a\\boldsymbol{X}_t + b\\boldsymbol{X}_t(\\boldsymbol{X}_t^{\\top}\\boldsymbol{X}_t) + c\\boldsymbol{X}_t(\\boldsymbol{X}_t^{\\top}\\boldsymbol{X}_t)^2\\label{eq:iteration} \\\\\n\n其中a,b,c是三个待求解的系数，如果想要更高阶的迭代算法，我们也可以逐次补充\\boldsymbol{X}_t(\\boldsymbol{X}_t^{\\top}\\boldsymbol{X}_t)^3、\\boldsymbol{X}_t(\\boldsymbol{X}_t^{\\top}\\boldsymbol{X}_t)^4等项，下面的分析过程是通用的。\n\n我们选择的初始值是\\boldsymbol{X}_0=\\boldsymbol{M}/\\Vert\\boldsymbol{M}\\Vert_F，\\Vert\\Vert_F是矩阵的范数，选择的依据是除以\\Vert\\boldsymbol{M}\\Vert_F不改变SVD的\\boldsymbol{U},\\boldsymbol{V}，但可以让\\boldsymbol{X}_0的所有奇异值都在[0,1]之间，让迭代的初始奇异值更标准一些。现在假设\\boldsymbol{X}_t可以SVD为\\boldsymbol{U}\\boldsymbol{\\Sigma}_t\\boldsymbol{V}^{\\top}，那么代入上式我们可以得到\n\n\\boldsymbol{X}_{t+1} = \\boldsymbol{U}_{[:,:r]}(a \\boldsymbol{\\Sigma}_{t,[:r,:r]} + b \\boldsymbol{\\Sigma}_{t,[:r,:r]}^3 + c \\boldsymbol{\\Sigma}_{t,[:r,:r]}^5)\\boldsymbol{V}_{[:,:r]}^{\\top} \\\\\n\n因此，式\\eqref{eq:iteration}实际上在迭代奇异值组成的对角阵\\boldsymbol{\\Sigma}_{[:r,:r]}，如果记\\boldsymbol{X}_t=\\boldsymbol{U}_{[:,:r]}\\boldsymbol{\\Sigma}_{t,[:r,:r]}\\boldsymbol{V}_{[:,:r]}^{\\top}，那么有\\boldsymbol{\\Sigma}_{t+1,[:r,:r]} = g(\\boldsymbol{\\Sigma}_{t,[:r,:r]})，其中g(x) = ax + bx^3 + cx^5。又因为对角阵的幂等于对角线元素各自取幂，所以问题简化成单个奇异值\\sigma的迭代。我们的目标是计算\\boldsymbol{U}_{[:,:r]}\\boldsymbol{V}_{[:,:r]}^{\\top}，换言之希望通过迭代将\\boldsymbol{\\Sigma}_{[:r,:r]}变为单位阵，这又可以简化为迭代\\sigma_{t+1} = g(\\sigma_t)将单个奇异值变为1。\n\n受@leloykun启发，我们将a,b,c的选择视为一个最优化问题，目标是让迭代过程对于任意初始奇异值都收敛得尽可能快。首先我们将g(x)重新参数化为\n\ng(x) = x + \\kappa x(x^2 - x_1^2)(x^2 - x_2^2) \\\\\n\n其中x_1 \\leq x_2。该参数化的好处是直观表示出了迭代的5个不动点0,\\pm x_1,\\pm x_2。由于我们的目标是收敛到1，因此初始化我们选择x_1 \u003c 1,x_2 \u003e 1，想法是不管迭代过程往x_1走还是往x_2走，结果都是1附近。\n\n接下来，我们确定迭代步数T，这样迭代过程就称为一个确定性函数，然后我们将矩阵的形状（即n,m）确定好，就可以采样一批矩阵，并通过SVD来算奇异值。最后，我们将这些奇异值当成输入，而目标输出则是1，损失函数是平方误差，整个模型完全可导，可以用梯度下降解决（@leloykun则假设了x_1 + x_2 = 2，然后用网格搜索来求解）。\n\n一些计算结果：\n\n\\begin{array}{ccc|ccc|ccc|c|c} \\hline n \u0026 m \u0026 T \u0026 \\kappa \u0026 x_1 \u0026 x_2 \u0026 a \u0026 b \u0026 c \u0026 \\text{mse} \u0026 \\text{mse}_{\\text{o}}\\\\ \\hline 1024 \u0026 1024 \u0026 3 \u0026 7.020 \u0026 0.830 \u0026 0.830 \u0026 4.328 \u0026 -9.666 \u0026 7.020 \u0026 0.10257 \u0026 0.18278 \\\\ 1024 \u0026 1024 \u0026 5 \u0026 1.724 \u0026 0.935 \u0026 1.235 \u0026 3.297 \u0026 -4.136 \u0026 1.724 \u0026 0.02733 \u0026 0.04431 \\\\ 2048 \u0026 1024 \u0026 3 \u0026 7.028 \u0026 0.815 \u0026 0.815 \u0026 4.095 \u0026 -9.327 \u0026 7.028 \u0026 0.01628 \u0026 0.06171 \\\\ 2048 \u0026 1024 \u0026 5 \u0026 1.476 \u0026 0.983 \u0026 1.074 \u0026 2.644 \u0026 -3.128 \u0026 1.476 \u0026 0.00038 \u0026 0.02954 \\\\ 4096 \u0026 1024 \u0026 3 \u0026 6.948 \u0026 0.802 \u0026 0.804 \u0026 3.886 \u0026 -8.956 \u0026 6.948 \u0026 0.00371 \u0026 0.02574 \\\\ 4096 \u0026 1024 \u0026 5 \u0026 1.214 \u0026 1.047 \u0026 1.048 \u0026 2.461 \u0026 -2.663 \u0026 1.214 \u0026 0.00008 \u0026 0.02563 \\\\ \\hline 2048 \u0026 2048 \u0026 3 \u0026 11.130 \u0026 0.767 \u0026 0.767 \u0026 4.857 \u0026 -13.103 \u0026 11.130 \u0026 0.10739 \u0026 0.24410 \\\\ 2048 \u0026 2048 \u0026 5 \u0026 1.779 \u0026 0.921 \u0026 1.243 \u0026 3.333 \u0026 -4.259 \u0026 1.779 \u0026 0.03516 \u0026 0.04991 \\\\ 4096 \u0026 4096 \u0026 3 \u0026 18.017 \u0026 0.705 \u0026 0.705 \u0026 5.460 \u0026 -17.929 \u0026 18.017 \u0026 0.11303 \u0026 0.33404 \\\\ 4096 \u0026 4096 \u0026 5 \u0026 2.057 \u0026 0.894 \u0026 1.201 \u0026 3.373 \u0026 -4.613 \u0026 2.057 \u0026 0.04700 \u0026 0.06372 \\\\ 8192 \u0026 8192 \u0026 3 \u0026 30.147 \u0026 0.643 \u0026 0.643 \u0026 6.139 \u0026 -24.893 \u0026 30.147 \u0026 0.11944 \u0026 0.44843 \\\\ 8192 \u0026 8192 \u0026 5 \u0026 2.310 \u0026 0.871 \u0026 1.168 \u0026 3.389 \u0026 -4.902 \u0026 2.310 \u0026 0.05869 \u0026 0.07606 \\\\ \\hline \\end{array}\\\\\n\n这里的\\text{mse}_{\\text{o}}是有Muon作者的a,b,c算出来的结果。从表格可以看出，结果跟矩阵大小、迭代步数都有明显关系；从损失函数来看，非方阵比方阵更容易收敛；Muon作者给出的a,b,c，大概是迭代步数为5时方阵的最优解。当迭代步数给定时，结果依赖于矩阵大小，这本质上是依赖于奇异值的分布，关于这个分布有个值得一提的结果是当n,m\\to\\infty时为Marchenko–Pastur分布。\n\n参考代码：\n\nimport jax\nimport jax.numpy as jnp\nfrom tqdm import tqdm\n\nn, m, T = 1024, 1024, 5\nkey, data = jax.random.key(42), jnp.array([])\nfor _ in tqdm(range(1000), ncols=0, desc='SVD'):\n    key, subkey = jax.random.split(key)\n    M = jax.random.normal(subkey, shape=(n, m))\n    S = jnp.linalg.svd(M, full_matrices=False)[1]\n    data = jnp.concatenate([data, S / (S**2).sum()**0.5])\n\n@jax.jit\ndef f(w, x):\n    k, x1, x2 = w\n    for _ in range(T):\n        x = x + k * x * (x**2 - x1**2) * (x**2 - x2**2)\n    return ((x - 1)**2).mean()\n\nf_grad = jax.grad(f)\nw, u = jnp.array([1, 0.9, 1.1]), jnp.zeros(3)\nfor _ in tqdm(range(100000), ncols=0, desc='SGD'):\n    u = 0.9 * u + f_grad(w, data)  # 动量加速\n    w = w - 0.01 * u\n\nk, x1, x2 = w\na, b, c = 1 + k * x1**2 * x2**2, -k * (x1**2 + x2**2), k\nprint(f'{n} \u0026 {m} \u0026 {T} \u0026 {k:.3f} \u0026 {x1:.3f} \u0026 {x2:.3f} \u0026 {a:.3f} \u0026 {b:.3f} \u0026 {c:.3f} \u0026 {f(w, data):.5f}')\n一些思考\n\n如果按照默认选择T=5，那么对于一个n\\times n的矩阵参数，Muon的每一步更新至少需要算15次n\\times n与n\\times n的矩阵乘法，这计算量毋庸置疑是比Adam明显大的，由此可能有读者担心Muon实践上是否可行。\n\n事实上，这种担心是多余的，Muon计算虽然比Adam复杂，但每一步增加的时间不多，笔者的结论是5%内，Muon作者则声称能做到2%。这是因为Muon的矩阵乘法发生在当前梯度计算完后、下一梯度计算前，这期间几乎所有的算力都是空闲的，而这些矩阵乘法是静态大小且可以并行，因此不会明显增加时间成本，反而是Muon比Adam少一组缓存变量，显存成本更低。\n\nMuon最值得深思的地方，其实是向量与矩阵的内在区别，以及它对优化的影响。SGD、Adam、Tiger等常见优化器的更新规则是Element-wise的，即不论向量、矩阵参数，实际都视为一个大向量，分量按照相同的规则独立地更新。具备这个特性的优化器往往理论分析起来更加简化，也方便张量并行，因为一个大矩阵切成两个小矩阵独立处理，并不改变优化轨迹。\n\n但Muon不一样，它以矩阵为基本单位，考虑了矩阵的一些独有特性。可能有些读者会奇怪：矩阵和向量不都只是一堆数字的排列吗，能有什么区别？举个例子，矩阵我们有“迹（trace）”这个概念，它是对角线元素之和，这个概念不是瞎定义的，它有一个重要特性是在相似变换下保持不变，它还等于矩阵的所有特征值之和。从这个例子就可以看出，矩阵的对角线元素跟非对角线元素，地位其实是不完全对等的。而Muon正是因为考虑了这种不对等性，才有着更好的效果。\n\n当然，这也会导致一些负面影响。如果一个矩阵被划分到不同设备上，那么用Muon时就需要将它们的梯度就需要汇聚起来再计算更新量了，而不能每个设备独立更新，这增加了通信成本。即便我们不考虑并行方面，这个问题也存在，比如Multi-Head Attention一般是通过单个大矩阵投影到Q（K,V同理），然后用reshape的方式得到多个Head，这样在模型参数中就只有单个矩阵，但它本质上是多个小矩阵，所以按道理我们需要将大矩阵拆开成多个小矩阵独立更新。\n\n总之，Muon这种非Element-wise的更新规则，在捕捉向量与矩阵的本质差异的同时，也会引入一些小问题，这可能会不满足一些读者的审美。\n\n（补充：几乎在本博客发布的同时，Muon的作者Keller Jordan也发布了自己的一篇博客《Muon: An optimizer for hidden layers in neural networks》。）\n\n范数视角\n\n从理论上看，Muon捕捉了矩阵的什么关键特性呢？也许接下来的范数视角可以回答我们的问题。\n\n这一节的讨论主要参考了论文《Stochastic Spectral Descent for Discrete Graphical Models》和《Old Optimizer, New Norm: An Anthology》，特别是后一篇。不过其中的出发点并不是新的，我们在《梯度流：探索通向最小值之路》就已经简单涉猎过：对于向量参数\\boldsymbol{w}\\in\\mathbb{R}^n，我们将下一步的更新规则定义为\n\n\\boldsymbol{w}_{t+1} = \\mathop{\\text{argmin}}_{\\boldsymbol{w}} \\frac{\\Vert\\boldsymbol{w} - \\boldsymbol{w}_t\\Vert^2}{2\\eta_t} + \\mathcal{L}(\\boldsymbol{w}) \\\\\n\n其中\\Vert\\Vert是某个向量范数，这称为在某个范数约束下的“最速梯度下降”。接着假设\\eta_t足够小，那么第一项占主导，这意味着\\boldsymbol{w}_{t+1}与\\boldsymbol{w}_t会很接近，于是我们假设\\mathcal{L}(\\boldsymbol{w})的一阶近似够用了，于是问题简化成\n\n\\boldsymbol{w}_{t+1} = \\mathop{\\text{argmin}}_{\\boldsymbol{w}} \\frac{\\Vert\\boldsymbol{w} - \\boldsymbol{w}_t\\Vert^2}{2\\eta_t} + \\mathcal{L}(\\boldsymbol{w}_t) + \\nabla_{\\boldsymbol{w}_t}\\mathcal{L}(\\boldsymbol{w}_t)^{\\top}(\\boldsymbol{w}-\\boldsymbol{w}_t) \\\\\n\n记\\Delta\\boldsymbol{w}_{t+1} = \\boldsymbol{w}_{t+1}-\\boldsymbol{w}_t, \\boldsymbol{g}_t = \\nabla_{\\boldsymbol{w}_t}\\mathcal{L}(\\boldsymbol{w}_t)，那么可以简写成\n\n\\Delta\\boldsymbol{w}_{t+1} = \\mathop{\\text{argmin}}_{\\Delta\\boldsymbol{w}} \\frac{\\Vert\\Delta\\boldsymbol{w}\\Vert^2}{2\\eta_t} + \\boldsymbol{g}_t^{\\top}\\Delta\\boldsymbol{w} \\\\\n\n计算\\Delta\\boldsymbol{w}_{t+1}的一般思路是求导，但《Old Optimizer, New Norm: An Anthology》提供了一个不用求导的统一方案：将\\Delta\\boldsymbol{w}分解为范数\\gamma = \\Vert\\Delta\\boldsymbol{w}\\Vert和方向向量\\boldsymbol{\\phi} = -\\Delta\\boldsymbol{w}/\\Vert\\Delta\\boldsymbol{w}\\Vert，于是\n\n\\min_{\\Delta\\boldsymbol{w}} \\frac{\\Vert\\Delta\\boldsymbol{w}\\Vert^2}{2\\eta_t} + \\boldsymbol{g}_t^{\\top}\\Delta\\boldsymbol{w} = \\min_{\\gamma\\geq 0, \\Vert\\boldsymbol{\\phi}\\Vert=1} \\frac{\\gamma^2}{2\\eta_t} - \\gamma\\boldsymbol{g}_t^{\\top}\\boldsymbol{\\phi} = \\min_{\\gamma\\geq 0} \\frac{\\gamma^2}{2\\eta_t} - \\gamma\\bigg(\\underbrace{\\max_{\\Vert\\boldsymbol{\\phi}\\Vert=1}\\boldsymbol{g}_t^{\\top}\\boldsymbol{\\phi}}_{\\text{记为}\\Vert \\boldsymbol{g}_t\\Vert^{\\dagger}}\\bigg) \\\\\n\n\\gamma只是一个标量，跟学习率类似，容易求得最优值是\\eta_t\\Vert \\boldsymbol{g}_t\\Vert^{\\dagger}，而更新方向则是最大化\\boldsymbol{g}_t^{\\top}\\boldsymbol{\\phi}（\\Vert\\boldsymbol{\\phi}\\Vert=1）的\\boldsymbol{\\phi}^*。现在代入欧氏范数即\\Vert\\boldsymbol{\\phi}\\Vert_2 = \\sqrt{\\boldsymbol{\\phi}^{\\top}\\boldsymbol{\\phi}}，我们就有\\Vert \\boldsymbol{g}_t\\Vert^{\\dagger}=\\Vert \\boldsymbol{g}_t\\Vert_2和\\boldsymbol{\\phi}^* = \\boldsymbol{g}_t/\\Vert\\boldsymbol{g}_t\\Vert_2，这样一来\\Delta\\boldsymbol{w}_{t+1}=-\\eta_t \\boldsymbol{g}_t，即梯度下降（SGD）。一般地，对于p范数\n\n\\Vert\\boldsymbol{\\phi}\\Vert_p = \\sqrt[\\uproot{10}p]{\\sum_{i=1}^n |\\phi_i|^p}\\\\Hölder不等式给出\\boldsymbol{g}^{\\top}\\boldsymbol{\\phi} \\leq \\Vert \\boldsymbol{g}\\Vert_q \\Vert \\boldsymbol{\\phi}\\Vert_p，其中1/p + 1/q = 1，利用它我们得到 \\max_{\\Vert\\boldsymbol{\\phi}\\Vert_p=1}\\boldsymbol{g}^{\\top}\\boldsymbol{\\phi} = \\Vert \\boldsymbol{g}\\Vert_q\\\\\n\n等号成立的条件是\n\n\\boldsymbol{\\phi}^* = \\frac{1}{\\Vert\\boldsymbol{g}\\Vert_q^{q/p}}\\Big[\\text{sign}(g_1) |g_1|^{q/p},\\text{sign}(g_2) |g_2|^{q/p},\\cdots,\\text{sign}(g_n) |g_n|^{q/p}\\Big] \\\\\n\n以它为方向向量的优化器叫做pbSGD，可参考《pbSGD: Powered Stochastic Gradient Descent Methods for Accelerated Non-Convex Optimization》。特别地，当p\\to\\infty时有q\\to 1和|g_i|^{q/p}\\to 1，此时退化为SignSGD，即SignSGD实际上是\\Vert\\Vert_{\\infty}范数下的最速梯度下降。\n\n矩阵范数\n\n现在让我们将目光切换到矩阵参数\\boldsymbol{W}\\in\\mathbb{R}^{n\\times m}。类似地，我们将它的更新规则定义为\n\n\\boldsymbol{W}_{t+1} = \\mathop{\\text{argmin}}_{\\boldsymbol{W}} \\frac{\\Vert\\boldsymbol{W} - \\boldsymbol{W}_t\\Vert^2}{2\\eta_t} + \\mathcal{L}(\\boldsymbol{W}) \\\\\n\n此时\\Vert\\Vert是某种矩阵范数。同样使用一阶近似，我们得到\n\n\\Delta\\boldsymbol{W}_{t+1} = \\mathop{\\text{argmin}}_{\\Delta\\boldsymbol{W}} \\frac{\\Vert\\Delta\\boldsymbol{W}\\Vert^2}{2\\eta_t} + \\text{Tr}(\\boldsymbol{G}_t^{\\top}\\Delta\\boldsymbol{W}) \\\\\n\n这里\\Delta\\boldsymbol{W}_{t+1} = \\boldsymbol{W}_{t+1}-\\boldsymbol{W}_t, \\boldsymbol{G}_t = \\nabla_{\\boldsymbol{W}_t}\\mathcal{L}(\\boldsymbol{W}_t)。还是使用“范数-方向”解耦，即设\\gamma = \\Vert\\Delta\\boldsymbol{w}\\Vert和\\boldsymbol{\\Phi} = -\\Delta\\boldsymbol{W}/\\Vert\\Delta\\boldsymbol{W}\\Vert，我们得到\n\n\\min_{\\Delta\\boldsymbol{W}} \\frac{\\Vert\\Delta\\boldsymbol{W}\\Vert^2}{2\\eta_t} + \\text{Tr}(\\boldsymbol{G}_t^{\\top}\\Delta\\boldsymbol{W}) = \\min_{\\gamma\\geq 0} \\\n\n\n## 图片\n\n![图片](https://pica.zhimg.com/v2-ddf658f2e6ef81ef4a5c8a6a53e2abf9_l.jpg?source=32738c0c\u0026needBackground=1)\n\n![图片](https://pic1.zhimg.com/v2-6558ca50578916708daa98779d79d86f_l.jpg?source=32738c0c\u0026needBackground=1)\n\n![图片](https://picx.zhimg.com/v2-4a07bc69c4bb04444721f35b32125c75_l.png?source=32738c0c)\n\n![图片](https://pic3.zhimg.com/v2-4dcf698b669d6aee78887c8a7548a4b8_1440w.jpg)\n\n![图片](https://picx.zhimg.com/v2-2866421e8833d83bd640c53ec247e509_1440w.jpg)\n\n![图片](https://picx.zhimg.com/v2-c5be1695771c4f9b442b5bde56e5e8e0_720w.jpg?source=172ae18b)\n\n![图片](https://picx.zhimg.com/v2-6558ca50578916708daa98779d79d86f_l.jpg?source=172ae18b)\n\n![图片](https://pic1.zhimg.com/v2-4a07bc69c4bb04444721f35b32125c75_l.png?source=32738c0c)\n\n![图片](https://pica.zhimg.com/v2-e872bbdfd2ad3ac449171a244515a219.webp?source=7e7ef6e2\u0026needBackground=1)\n\n![图片](https://pic4.zhimg.com/v2-b5bfd50abb22df2daf6477d7b387cf31.webp)\n\n![图片](https://pica.zhimg.com/v2-abed1a8c04700ba7d72b45195223e0ff_l.jpg?source=06d4cd63)\n\n![图片](https://picx.zhimg.com/v2-6558ca50578916708daa98779d79d86f_l.jpg?source=06d4cd63)\n\n![图片](https://pic1.zhimg.com/v2-c71427010ca7866f9b08c37ec20672e0.png)\n\n![图片](https://pic1.zhimg.com/v2-abed1a8c04700ba7d72b45195223e0ff_l.jpg?source=06d4cd63)\n\n![图片](https://picx.zhimg.com/v2-93e828703c559fc306d10d802139a996_l.jpg?source=06d4cd63)\n\n![图片](https://picx.zhimg.com/v2-fd425751f8e830685d299d10aec38b55_l.jpg?source=06d4cd63)\n\n![图片](https://picx.zhimg.com/v2-d88cf689141311b8ab05e55ed4efe54f_l.jpg?source=06d4cd63)\n\n![图片](https://picx.zhimg.com/v2-abed1a8c04700ba7d72b45195223e0ff_
