summary: |
  实现一个基本的RRT（Rapidly-exploring Random Tree）路径规划算法。

  **核心步骤**：
  1. 初始化树，根节点为起点
  2. 在配置空间中随机采样一个点
  3. 找到树中距离采样点最近的节点
  4. 从最近节点向采样点方向扩展步长ε
  5. 检查新边是否与障碍物碰撞
  6. 无碰撞则加入树，重复直到到达目标区域
  7. 从目标回溯路径
code_snippet: |
  ```python
  class RRT:
      def __init__(self, start, goal, obstacle_list, bounds, step_size=0.5, max_iter=1000):
          self.start = Node(start)
          self.goal = Node(goal)
          self.obstacle_list = obstacle_list
          self.bounds = bounds
          self.step_size = step_size
          self.max_iter = max_iter
          self.node_list = [self.start]

      def plan(self):
          for i in range(self.max_iter):
              rnd_point = self.random_sample()
              nearest_node = self.nearest_neighbor(rnd_point)
              new_node = self.steer(nearest_node, rnd_point)
              if not self.check_collision(nearest_node, new_node):
                  self.node_list.append(new_node)
                  if self.distance(new_node, self.goal) < self.step_size:
                      return self.extract_path(new_node)
          return None
  ```
key_points:
  - "RRT是概率完备的：只要存在路径，采样足够多必然能找到"
  - "RRT*在RRT基础上增加了重连(rewire)步骤，保证渐进最优"
  - "步长ε的选择直接影响搜索速度和质量"
  - "碰撞检测通常使用线段与障碍物的几何计算"
  - "扩展时可以加入目标偏向(goal bias)加速收敛"
