summary: |
  深入理解Transformer架构的设计空间和演化方向，涵盖面试中常见的进阶问题。

  **1. Self-Attention的本质**
  自注意力可以看作在输入序列上学习一个全连接图，边的权重由QK相似度决定。O(n²d)的复杂度源于每对位置都需要计算attention score。

  **2. Multi-Head的动机**
  不同head关注不同子空间（语义、语法、位置等），类似CNN中不同卷积核提取不同特征。实验表明单头平均效果不如多头但方差更小。

  **3. 复杂度优化方向**
  - **稀疏注意力**（Sparse Attention）：只计算部分位置的注意力（如滑动窗口+全局token），复杂度降至O(n·k·d)
  - **线性注意力**（Linear Attention）：用核函数近似softmax，将计算顺序从(QK^T)V改为Q(K^TV)
  - **FlashAttention**：从IO角度优化，利用Tiling和Recompute减少HBM读写

  **4. MoE（Mixture of Experts）**
  - 用Router选择top-k个Expert处理每个token
  - 关键问题：Load Balancing（防止专家使用不均）、Expert Capacity
  - Switch Transformer用辅助loss强制均衡，GLaM用capacity factor限制
  - 推理时只激活部分参数（Sparse Activation），总参数量大但计算量可控

  **5. 位置编码演进**
  - 绝对位置编码（Sinusoidal/Learned）→ 相对位置编码（Shaw et al.）→ RoPE（旋转位置编码，LLaMA/Qwen在用）
  - RoPE通过复数旋转隐式编码相对位置，且具有良好的外推性
key_points:
  - "Self-Attention QK^T的计算复杂度O(n²d)是长序列瓶颈"
  - "Multi-Head让不同head关注不同表示子空间，实际是分头降维再拼接"
  - "FlashAttention通过Tiling将O(n²)的HBM读写降到O(n²d²/M)，实现2-4x加速"
  - "MoE用稀疏激活实现'大参数量小计算量'，关键挑战是专家负载均衡"
  - "RoPE已成为主流LLM的位置编码方案，数学上等价于在query/key上施加旋转"
  - "Pre-norm（LayerNorm在Attention/FFN之前）比Post-norm训练更稳定"
