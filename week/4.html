ma \\max_{a}\\check{q}(S^{'} , a , w) - \\check{q} (S , A , w) )^2] \\\\ q(s ,a ) = E [R_{t+1} + \\gamma \\max_{a} \\check{q}(S^{'},a , w) - \\check{q}(S,A , w) ] \\end{matrix}\n贝尔曼最优方程 由于目标函数中有个参数的函数，导致计算梯度并非易事。将参数固定一个，更新一个，来回迭代\nJ = E [(R + \\gamma \\max_{a}\\check{q}(S^{'} , a , w_{T}) - \\check{q} (S , A , w) )^2]\n技巧一：主干网络和目标网络（方便更新计算梯度） 初始w , w_{T}参数一样 不用显示计算上面的梯度，因为神经网络会自动反向传播更新参数\n技巧二：经验回放 我们对采样过程没有先验知识，最简单的方法就是均匀分布。实际上采样不可能是均匀的（样本之间有关联性），为了服从均匀分布，需要将样本顺序打乱，让其服从均匀分布，经验回放的好处：每个样本都会被利用多次，提高利用效率。\n2 连续空间（策略梯度）\n\n之前贝尔曼方程的一个前提是动态规划，离散之后得到贝尔曼方程，贝尔曼方程只能处理离散空间，那么sara\\Q_learning只能处理离散状态。 现在直接不从动态规划入手，直接优化策略函数 优化目标：\n\\max_{\\theta} \\ J(\\theta) = \\mathbb{E}_{\\tau \\sim \\pi_{\\theta}} \\left[ R(\\tau) \\right]\n把期望写成积分形式：\n\n\\begin{matrix} J(\\theta) = \\int p_{\\theta}(\\tau) R(\\tau) d\\tau \\\\ \\nabla_{\\theta} J(\\theta) = \\int \\nabla_{\\theta} p_{\\theta}(\\tau) R(\\tau) d\\tau \\\\ \\nabla_{\\theta} J(\\theta) = \\mathbb{E}_{\\tau \\sim \\pi_{\\theta}} \\left[ R(\\tau) \\cdot \\sum_{t=0}^{\\infty} \\nabla_{\\theta} \\log \\pi_{\\theta}(a_t \\mid s_t) \\right] \\end{matrix}\n为了降低方差选择（期望保持不变），引入基线b(s） = v(s)\n\n\\nabla_{\\theta}J(\\theta)=\\mathbb{E}\\left[\\ \\nabla_{\\theta}\\ln\\pi(A|S,\\theta)\\big(q_{\\pi}(S,A)-v_{\\pi}(S)\\big)\\right].\n为了去掉期望，采样随机梯度下降RM\n\\theta_{t+1}=\\theta_{t}+\\alpha_{\\theta}\\nabla_{\\theta}\\ln\\pi(a_{t}|s_{t},\\theta_{t})\\big(q_{t}(s _{t},a_{t})-v_{t}(s_{t})\\big)\n估计价值，采样随机梯度下降RM\n\n\\begin{matrix} q_{t}(s_{t},a_{t})-v_{t}(s_{t})\\approx r_{t+1}+\\gamma v_{t}(s_{t+1})-v_{t}(s_{ t})\\doteq\\delta_{t}(s_{t},a_{t}). \\\\ \\theta_{t+1}=\\theta_{t}+\\alpha_{\\theta}{\\beta(a _{t}|s_{t})}\\nabla_{\\theta}\\ln\\pi(a_{t}|s_{t},\\theta)\\delta_{t}(s_{t},a_{t}). \\end{matrix}\n\n2.1 异策略PG(多一层重要性采样)\nOff policy 策略梯度对额外的基准函数b(s)是不变的，因为\\mathbb{E}\\left[\\tfrac{\\pi(A|S,\\theta)}{\\beta(A|S)}\\nabla_{\\theta}\\ln\\pi(A|S, \\theta)b(S)\\right]=0\n\n\\nabla_{\\theta}J(\\theta)=\\mathbb{E}_{S\\sim\\rho,A\\sim\\beta}\\left[\\frac{\\pi(A|S, \\theta)}{\\beta(A|S)}\\nabla_{\\theta}\\ln\\pi(A|S,\\theta)\\big(q_{\\pi}(S,A)-b(S) \\big)\\right]\n为了降低方差选择b(s） = v(s)\n\n\\nabla_{\\theta}J(\\theta)=\\mathbb{E}\\left[\\frac{\\pi(A|S,\\theta)}{\\beta(A|S)} \\nabla_{\\theta}\\ln\\pi(A|S,\\theta)\\big(q_{\\pi}(S,A)-v_{\\pi}(S)\\big)\\right].\n为了去掉期望，采样随机梯度下降RM\n\\theta_{t+1}=\\theta_{t}+\\alpha_{\\theta}\\frac{\\pi(a_{t}|s_{t},\\theta_{t})}{ \\beta(a_{t}|s_{t})}\\nabla_{\\theta}\\ln\\pi(a_{t}|s_{t},\\theta_{t})\\big(q_{t}(s _{t},a_{t})-v_{t}(s_{t})\\big)\n\n估计价值，采样随机梯度下降RM\n\n\\begin{matrix} q_{t}(s_{t},a_{t})-v_{t}(s_{t})\\approx r_{t+1}+\\gamma v_{t}(s_{t+1})-v_{t}(s_{ t})\\doteq\\delta_{t}(s_{t},a_{t}). \\\\ \\theta_{t+1}=\\theta_{t}+\\alpha_{\\theta}\\frac{\\pi(a_{t}|s_{t},\\theta)}{\\beta(a _{t}|s_{t})}\\nabla_{\\theta}\\ln\\pi(a_{t}|s_{t},\\theta)\\delta_{t}(s_{t},a_{t}). \\end{matrix}\n\n2.2 TRPO(理论天花板)\n\n2.2.1 问题构建（新旧策略性能比较）\n\n策略性能 \\eta_{old}一定不会比\\eta_{old}差，因此需要知道差异在哪里，好方便实现单调改进 新策略 \\tilde{\\pi}的性能\\eta(\\tilde{\\pi})与旧策略的性能\\eta(\\pi),具体差距在哪里？\n\n\\eta(\\tilde{\\pi}) =\\eta(\\pi)+\\mathbb{E}_{{s}_{\\mathsf{0}},\\bm{a}_{\\mathsf{0}}, {s}_{\\mathsf{1}},\\bm{a}_{\\mathsf{1}},\\cdots\\sim\\tilde{\\pi}}\\left[\\sum_{t=0} ^{\\infty}\\gamma^{t}A_{\\pi}(\\bm{s}_{t},{a}_{t})\\right]\\newline \\eta(\\tilde{\\pi}) =\\eta(\\pi)+\\sum_{{s}}\\rho_{\\tilde{\\pi}}(\\bm{s})\\sum_{a}\\tilde {\\pi}({a}|{s})A_{\\pi}(\\bm{s},{a})\n\n直观理解： 新策略的性能等于旧策略的性能，加上一个“修正项”。这个修正项是：在新策略访问到的每个状态上，新策略选择的动作相对于旧策略的平均优势，并按其访问频率进行加权。 如果在新策略访问的所有状态上，新策略选择的动作平均来看都比旧策略好（即\\sum_{a} \\widetilde{ \\pi} \\left( a|s \\right) A_{ \\pi} \\left( s,a \\right)\u003e0）,那么总性能就会提升。\n\n问题在于：公式中的\\bm{\\rho_{\\tilde{\\pi}}(s)}赖于我们想要优化的新策略 \\tilde{\\pi}本身，这使得直接优化这个公式非常困难（成了一个循环依赖问题）。为了解决上述难题，论文引入一个局部近似,L_{\\pi}(\\tilde{\\pi})=\\eta(\\pi)+\\sum_{\\bm{s}}\\rho_{\\pi}(\\bm{s})\\sum_{a}\\tilde{ \\pi}(\\bm{a}|\\bm{s})A_{\\pi}(\\bm{s},\\bm{a}),它做了一個关键的替换，将新策略\\bm{\\rho_{\\tilde{\\pi}}(s)}替换为旧策略\\bm{\\rho_{{\\pi}}(s)}\n\n原理：L_{ \\pi} \\left( \\tilde{ \\pi} \\right) \\text{} 是\\eta \\left( \\tilde{ \\pi} \\right)的一阶近似，也就是说在\\boldsymbol{\\tilde{\\pi}}=\\boldsymbol{\\pi}这一点，两者函数值相等，且梯度相同：\n\n{L_{\\pi_{\\theta_{old}}}(\\pi_{\\theta_{old}})}={\\eta(\\pi_{ \\theta_{old}})}\\newline {\\nabla_{\\theta}L_{\\pi_{\\theta_{old}}}(\\pi_{\\theta})|_{\\theta= \\theta_{old}}}={\\nabla_{\\theta}\\eta(\\pi_{\\theta})|_{\\theta=\\theta_{old}}}\n\n这意味着，在旧策略附近一个无限小的区域内，优化L_{ \\pi} \\left( \\tilde{ \\pi} \\right) \\text{} 就等价于优化真实的\\eta \\left( \\tilde{ \\pi} \\right)\n\n2.2.2 近似的优化问题距离真实问题有多远？\n\n虽然L_{ \\pi} \\left( \\tilde{ \\pi} \\right) \\text{} 是局部准确的，但我们想知道，当策略更新步长不是无限小时，真实性能\\eta \\left( \\tilde{ \\pi} \\right)和替代损失L_{ \\pi} \\left( \\tilde{ \\pi} \\right) \\text{} 之间到底会差多少？ 保守策略迭代的启发：Kakade \u0026 Langford (2002) 针对一种特殊的策略更新方式——混合策略\n\n{\\pi_{new}=(1-\\alpha)\\pi_{old}+\\alpha\\pi^{\\prime}}\n\n证明了一个重要的性能下界:\n\n\\eta \\left( \\pi_{new} \\right) \\leq L_{ \\pi_{old}} \\left( \\pi_{new} \\right)+ \\frac{2 \\epsilon \\gamma}{ \\left( 1- \\gamma \\right)^{2}} \\alpha^{2}\n\n其中：\n\n\\bm{\\epsilon=\\max_{s}|\\mathbb{E}_{a\\sim\\pi^{\\prime}}[A_{\\pi}(s,a)]|}\n\n{\\eta(\\pi_{\\mathrm{new}})}\\leq L_{\\pi_{\\mathrm{old}}}(\\pi_{\\mathrm{ new}})+C\\boldsymbol{\\alpha^{2}}\\quad\\boldsymbol{}\n\n现在，我们在每一步迭代中，都尝试去最小化这个上界的右边部分。也就是说，我们求解以下优化问题：\n\nL_{\\pi_{\\text{old}}}(\\pi_{\\text{new}})+C\\alpha^{2}\\leq L_{\\pi_{\\text{old}}}( \\pi_{\\text{old}})+C\\cdot 0^{2}\n\n因为当{\\pi}={\\pi}_{\\mathbf{old}} , \\alpha = 0时刻，L_{ \\pi_{old}} \\left( \\pi_{old} \\right)= \\eta \\left( \\pi_{old} \\right)，所以上式变为\n\n{L_{\\pi_{\\text{old}}}(\\pi_{\\text{new}})+C\\alpha^{2}\\leq\\eta(\\pi_{ \\text{old}})}\n\n因此结合上面证明：\n\n\\boldsymbol{\\eta(\\pi_{\\mathrm{new}})}\\leq\\underbrace{\\boldsymbol{L_{\\pi_{ \\mathrm{old}}}(\\pi_{\\mathrm{new}})+C\\alpha^{2}}}_{\\text{性能上界}}\\leq \\underbrace{\\boldsymbol{\\eta(\\pi_{\\mathrm{old}})}}_{\\text{旧性能}}\n\n最终结论：\n\n\\boldsymbol{\\eta(\\pi_{\\mathrm{new}})}\\leq\\boldsymbol{\\eta(\\pi_{\\mathrm{old}})}\n\n由于我们是在最小化一个成本函数，所以“更小”意味着“更好”。因此，这个不等式意味着新策略的性能保证不差于旧策略。 更准确地说，只要优化过程能使上界下降，真实性能就一定会单调改进。\n\n\\eta \\left( \\pi_{new} \\right)（真实性能）：是您房间的实际高度。您无法直接看到它\n\nL_{\\pi_{\\mathrm{old}}}(\\pi_{\\mathrm{ new}})+C\\boldsymbol{\\alpha^{2}}\\quad\\boldsymbol{}（性能上界）：是您房间的天花板高度。您知道实际高度绝不会超过天花板。\n\n\\eta \\left( \\pi_{old} \\right)（旧性能）：是您之前待的另一个房间的已知高度。\n\nTRPO的算法过程就是： 每一步，您都想办法降低新房间的天花板，确保这个新天花板比您旧房间的高度还要低。那么，即使您看不到新房间的实际高度，您也百分之百地确信，新房间的实际高度肯定比旧房间的高度要低（即性能更好）。\n\n为了防止策略更新差别过大，引入KL散度在上述公式中： 将上述结论推广到了任意的随机策略，而不仅仅是混合策略。它指出，只要将混合系数\\alpha替换为两个策略之间的最大总变分散度\n{\\alpha=D_{TV}^{\\max}(\\pi_{old},\\pi_{new})}\n（证明见原文） 利用 Pinsker 不等式：\n\\left(D_{{}_{T V}} \\left(p || q\\right)\\right)^{{}_{2}} \\leq \\frac{1}{2}D _{{}_{KL}} \\left(p || q\\right)\n\n将更直观的TV散度转换为更便于优化的KL散度，得到最终的理论基础：\n{\\eta(\\tilde{\\pi})}\\leq{L_{\\pi}(\\tilde{\\pi})}+ {C\\cdot D_{KL}^{\\max}(\\pi,\\tilde{\\pi})}\n其中：\nC=\\tfrac{2\\epsilon\\gamma}{(1-\\gamma)^{2}},\\ D_{\\textit{KL}}^{\\max}(\\pi,\\tilde{ \\pi})=\\max\\nolimits_{s}D_{\\textit{KL}}(\\pi(\\cdot|\\bm{s})\\parallel\\tilde{\\pi}( \\cdot|\\bm{s}))\n\n2.2.3 优化问题的形成\n\n求解优化问题：\n\\underset{\\theta}{\\text{minimize}}\\left[L_{\\theta_{\\mathit{old}}}(\\theta)+C \\cdot D_{\\mathit{KL}}^{\\max}(\\theta_{\\mathit{old}},\\theta)\\right]\n通过最小化这个带有惩罚项的目标，我们可以保证真实目标\\eta \\left( \\pi_{new} \\right)\n不会变差 为什么不能直接用这个公式？ 因为理论给出的惩罚系数 C 通常非常大，这会导致优化器采取极其保守的微小步长，学习速度极慢。（数值病态） TRPO 的巧妙转换：惩罚项 → 约束项 与其使用一个大常数 CC 来惩罚KL散度，不如直接约束KL散度的大小，在这个信任区域内尽情地优化\nL_{\\theta_{\\mathit{old}}}(\\theta)\n\n优化问题变形为：\n\\underset{\\theta}{\\text{minimize}} L_{\\theta_{\\mathit{old}}}(\\theta)\\quad\\text{subject to} D_{\\mathit{KL}}^{\\max}(\\theta_{\\mathit{old}},\\theta)\\leq\\delta\n\n\\bm{D_{KL}^{\\max}}:约束要求每个状态的KL散度都小于\\delta ，这有无数个约束，不现实。因此，TRPO 将其松弛为对平均KL散度的约束：\\overline{D}_{\\textit{KL}}^{\\rho_{\\theta_{\\textit{old}}}}(\\theta_{\\textit{old}}, \\theta)=\\mathbb{E}_{\\textit{s}\\sim\\rho_{\\theta_{\\textit{old}}}}[D_{\\textit{KL}}( \\pi_{\\theta_{\\textit{old}}}(\\cdot|\\textit{s})\\parallel\\pi_{\\theta}(\\cdot| \\textit{s}))]\\leq\\delta;这个约束只有一个，并且可以通过采样来估计，非常实用。\n\n2.2.4 重要性采样（提升数据利用率）\n\n目标函数展开：\nL_{{}_{\\theta_{old}}}(\\theta)=\\eta(\\theta_{{}_{old}}) + \\sum_{s}\\rho_{{}_{ \\theta_{old}}}(s) \\sum_{a}\\pi_{{}_{\\theta}}(a | s)\\mathit{A}_{{}_{\\theta_{ old}}}(s,a)\n优化问题进一步等于（无关项去除）：\n\\begin{array}{l}\\max\\limits_{\\theta}\\sum\\limits_{s}\\rho_{{}_{\\theta_{old}}}( s) \\sum\\limits_{a}\\pi_{{}_{\\theta}}(a | s)\\textit{A}_{{}_{\\theta_{old}}}(s,a)\\\\ \\qquad s.t. \\bm{\\bar{D}}_{{}_{KL}}^{{}_{\\rho_{\\theta_{old}}}}(\\theta_{{}_{old }},\\theta) {\\leq} \\delta\\end{array}\n利用重要性采样（数据利用率提升），评估动作分布\nL_{\\theta_{old}} = \\sum_{a} \\pi_{a} \\left( a|s \\right) A_{ \\theta_{old}} \\left( s,a \\right)= \\left[ \\pi_{a \\sim q} \\left[ \\frac{ \\pi_{a} \\left( a|s \\right)}{q \\left( a|s \\right)} A_{ \\theta_{old}} \\left( s,a \\right) \\right] \\right.\n\\frac{ \\pi_{ \\theta}}{ \\pi_{ \\theta_{old}}}重要性权重。因为我们是用旧策略\\pi_{ \\theta_{old}}采样的数据\\boldsymbol{(s_{t},a_{t})}来评估新策略\\pi_{ \\theta}\n\nA_{ \\pi} \\left( s,a \\right)=Q_{ \\pi} \\left( s,a \\right)-V_{ \\pi} \\left( s \\right) \\approx {r_{t}+\\gamma V(s_{t+1})-V(s_{t})}\n优势函数(RM随机梯度下降算法+base line减小方差)，GAE的核心思想是：将蒙特卡洛估计（高方差、低偏差）和时序差分估计（低方差、高偏差）结合起来，通过一个参数 λ来平滑地控制权衡。 优化问题进一步：\n\\begin{split}\u0026\\max_{\\theta}J_{{}_{\\theta_{old}}}(\\theta) {=} \\mathbb{E}_{{}_{s\\sim\\rho_{{}_{\\theta_{old}}},a\\sim q}}\\left[\\frac{\\pi_{{}_{ \\theta}}(a | s)}{q(a | s)}A_{{}_{\\theta_{old}}}(s,a)\\right]\\\\ \u0026 s.t. \\mathbb{E}_{{}_{s\\sim\\rho_{{}_{\\theta_{old}}}}}\\left[ \\left.D_{{}_{KL}}\\left(\\pi_{{}_{\\theta_{old}}}(\\cdot | s) \\right\\|\\pi_{{}_{ \\theta}}(\\cdot | s)\\right)\\right]{\\leq} \\delta\\end{split}\n\n2.2.5 优化加速（问题一阶/二阶近似利用共轭梯度求解加速）\n\n带约束的问题直接求解困难\n\n局部近似（类似于SQP） 在{\\theta_{old}}处，对目标函数做一阶泰勒展开，对约束函数（平均KL散度）做二阶泰勒展开（因为它在{\\theta_{old}}处取最小值0，一阶导为0）。 利用泰勒展开：\nf \\left( x \\right)= \\sum_{n=0}^{ \\infty} \\frac{f^{ \\left( n \\right)} \\left( x_{0} \\right)}{n!} \\left( x-x_{0} \\right)^{n}=f \\left( x_{0} \\right)+f^{ \\prime} \\left( x_{0} \\right) \\left( x-x_{0} \\right)+ \\frac{1}{2}f^{ \\prime \\prime} \\left( x_{0} \\right) \\left( x-x_{0} \\right)^{2}+ \\frac{f^{ \\left( 3 \\right)} \\left( \\varepsilon \\right)}{3!} \\left( x-x_{0} \\right)^{3}\n近似后的问题变为（函数）：\n\\begin{matrix} L_{ \\theta_{old}}( \\theta) \\approx \\nabla_{ \\theta}L_{ \\theta_{old}}( \\theta) \\left|_{ \\theta= \\theta_{old}} \\cdot( \\theta- \\theta_{old}) \\right. \\\\ \\mathbb{E}_{{}_{s\\sim\\rho_{\\theta_{old}}}}\\left[D_{{}_{KL}}\\left(\\pi_{{}_{ \\theta_{old}}}(\\cdot | s) \\| \\pi_{{}_{\\theta}}(\\cdot | s)\\right)\\right] \\approx \\frac{1}{2}(\\theta- \\theta_{{}_{old}})^{{}^{T}} \\cdot I(\\theta_{ {}_{old}}) \\cdot (\\theta - \\theta_{{}_{old}}) \\end{matrix}\n其中：\nI_{ij} \\left( \\theta_{old} \\right)= \\left. \\frac{ \\partial^{2}E_{s \\sim \\rho_{ \\theta_{old}}} \\left[ D_{KL} \\left( \\pi_{ \\theta_{old}} \\left( \\cdot|s \\right)| \\pi_{ \\theta} \\left( \\cdot|s \\right) \\right) \\right]}{ \\partial \\theta_{i} \\partial \\theta_{j}} \\right|_{ \\theta= \\theta_{old}}\n那么近似之后的优化问题变成：\n\\left.\\begin{aligned} \u0026\\max_{\\theta}\\ \\left.\\nabla_{\\theta}L_{{}_{ \\theta_{ old}}}(\\theta)\\right|_{\\theta = \\theta_{ old}} \\cdot (\\theta - \\theta_{ old})\\\\ \u0026 s.t.\\ \\frac{1}{2}(\\theta - \\theta_{ old})^{{}_{T}} \\cdot I( \\theta_{ old}) \\cdot (\\theta - \\theta_{ old}) \\leq \\delta\\end{aligned}\\right.\n\n更新方向—-二次规划问题的解析解(利用共梯度法，避免显式求逆，加速计算)\n\n共轭梯度\n\n\\theta - \\theta_{ old} = \\frac{1}{ \\lambda} I^{-1} \\left( \\theta_{old} \\right) \\cdot \\nabla_{ \\theta}L_{ \\theta_{old}} \\left( \\theta \\right) |_{ \\theta = \\theta_{old}}\n\\frac{1}{ \\lambda}是步长，\\left( \\theta_{old} \\right) \\cdot \\nabla_{ \\theta}L_{ \\theta_{old}} \\left( \\theta \\right) |_{ \\theta = \\theta_{old}}是梯度 \\frac{1}{ \\lambda} I^{-1} \\left( \\theta_{old} \\right) \\cdot \\nabla_{ \\theta}L_{ \\theta_{old}} \\left( \\theta \\right) |_{ \\theta = \\theta_{old}}自然梯度方向，它考虑了策略空间的曲率，比普通梯度方向更好。直接求逆计算量巨大，TRPO使用共轭梯度法来(近似)高效求解方程\\nabla_{ \\theta}L_{ \\theta_{old}} \\left( \\theta \\right) |_{ \\theta= \\theta_{old}} = I^{} \\left( \\theta_{old} \\right) \\cdot x，得到 x \\approx I^{-1} \\left( \\theta_{old} \\right) \\cdot \\nabla_{ \\theta}L_{ \\theta_{old}} \\left( \\theta \\right) |_{ \\theta = \\theta_{old}}\n而无需显式存储或求逆 \\hat{g} = I^{-1} \\left( \\theta_{old} \\right) \\cdot \\nabla_{ \\theta}L_{ \\theta_{old}} \\left( \\theta \\right) |_{ \\theta = \\theta_{old}}\n\n更新步长（先求最大，然后回溯搜索，带约束） 解析解给出的步长可能仍然违反KL约束，因此，TRPO进行回溯线搜索：\n\n精确线搜索：(最大步长，但可能不满足约束)\n\\frac{\\delta L(\\theta,\\lambda)}{\\delta\\lambda} = 0\\Rightarrow\\delta- c = \\frac{1}{2}(\\beta\\hat{g})^{{}_{T}} \\cdot I(\\theta_{{}_{old}}) \\cdot ( \\beta\\hat{g}) = \\frac{1}{2} \\beta^{{}_{2}}\\hat{g}^{{}_{T}}I(\\theta_{{}_{old }})\\hat{g}\\ \\text{则}\\beta = \\sqrt{ \\frac{2(\\delta - c)}{|\\hat{g}^{{}^{T}}I( \\theta_{{}_{old}})\\hat{g}|}}\n回溯线搜索：（带约束） 回溯二分检查约束：\n\\overline{D}_{\\textit{KL}}\\left(\\theta_{\\textit{old}},\\theta_{\\textit{}} \\right)\\leq\\delta.\n2.3 PPO(TRPO工程近似版)\n\n信任域策略优化 (TRPO):\n\n理论坚实: 基于保守策略迭代 理论，提供了单调性能改进的保证。其核心是约束新旧策略之间的KL散度，确保新策略不会偏离旧策略太远。\n实现复杂: 为了实现KL约束，TRPO需要计算Fisher信息矩阵（FIM）的近似，并使用共轭梯度法 来求解带约束的优化问题。这带来了两大问题：\n计算开销大： 计算FIM和运行共轭梯度法比标准的随机梯度下降要复杂和耗时。TRPO的计算虽然稳定，但二阶优化过程非常耗时，工业界经常无法承受这么高的开销\n不兼容性： 难以应用于有Dropout、参数共享（如策略网络和价值网络共享底层特征提取器）或辅助任务的架构，因为这些技术会破坏对优化问题的线性/二次近似所需的假设。 优化问题经过近似之后的问题，求解优化问题：\n\\underset{\\theta}{\\text{minimize}}\\left[L_{\\theta_{\\mathit{old}}}(\\theta)+C \\cdot D_{\\mathit{KL}}^{\\max}(\\theta_{\\mathit{old}},\\theta)\\right]\n为了解决约束耗时的问题：\nL^{CLIP}(\\theta)=\\hat{\\mathbb{E}_{t}}\\left[\\min\\left(\\underbrace{r_{t}(\\theta )\\hat{A}_{t}}_{\\text{未裁剪项}},\\underbrace{\\operatorname{clip}(r_{t}( \\theta),1-\\epsilon,1+\\epsilon)\\hat{A}_{t}}_{\\text{裁剪项}}\\right)\\right]\n方案(裁剪方案）：PPO同样想使两个策略间差异不要过大， PPO放弃了精确的KL约束，转而采用一种启发式但极其有效的“软约束”——概率比裁剪\nclip\nPPO：只用一阶梯度 + 裁剪，没有 Fisher、没有 CG、没有线搜索，一轮就一次反向，快很多。\nTRPO：每轮 = 多次二阶乘积 + 多次 CG 迭代 + 多次线搜索，速度通常是 PPO 的 1/5～1/20。\n2.4 GRPO\n\nGRPO通过优化PPO算法，解决了计算优势值时需要同时依赖奖励模型（reward model）和价值模型（value model）的问题，成功移除了value model（价值模型），显著降低了推理时的内存占用和时间开销。Advantage（优势值）的核心价值在于为模型输出提供更精准的评估，不仅衡量答案的绝对质量，还通过相对比较（与其他回答的对比）来更全面地定位其优劣。 当时价值模型的提出，主要是策略梯度估计方差过高这一核心瓶颈。后面也证明了，最优的偏置就是价值函数，价值函数RM近似就是TD差分\n\nGRPO\n\n计算损失 这一步的目标是最大化优势，同时确保模型保持在参考策略附近。因此，损失定义如下：\n\n\\begin{array}{l}\\mathcal{L}_{\\text{GRPO}}\\hskip-1.0pt\\left(\\theta\\right)=- \\frac{1}{G}\\sum_{i=1}^{G}\\frac{1}{\\left|o_{i}\\right|}\\sum_{t=1}^{\\left|o_{i} \\right|}\\left[\\frac{\\pi_{\\theta}\\left(o_{i,t}|q,o_{i,\u003ct}\\right)}{\\left[\\pi_{ \\theta}\\left(o_{i,t}|q,o_{i,\u003ct}\\right)\\right]_{\\text{no grad}}}\\hat{A}_{i,t} \\hskip 1.0pt-\\beta\\mathbb{D}_{\\text{KL}}\\left[\\pi_{\\theta}\\|\\pi_{\\text{ref}} \\right]\\right]\\end{array}\n\n其中第一项表示缩放后的优势，第二项通过KL散度惩罚与参考策略的偏离 在原始论文中，该公式被推广为在每次生成后通过利用裁剪替代目标（clipped surrogate objective）进行多次更新：\n\n\\begin{array}{l}\\mathcal{L}_{\\mathrm{GRPO}}\\big(\\theta\\big)=-\\frac{1}{G} \\sum_{l=1}^{G\n\n\n## 图片\n\n![图片](https://picx.zhimg.com/v2-ddf658f2e6ef81ef4a5c8a6a53e2abf9_l.jpg?source=32738c0c\u0026needBackground=1)\n\n![图片](https://pica.zhimg.com/v2-6532db27969756feb5a5380a1d68dfb0_l.jpg?source=32738c0c\u0026needBackground=1)\n\n![图片](https://pic1.zhimg.com/v2-4b2eae6eed5254df81e5edb9230070f8_1440w.jpg)\n\n![图片](https://pica.zhimg.com/v2-1f5de55645826dff97afd5336c7cb24e_1440w.jpg)\n\n![图片](https://pic3.zhimg.com/v2-64b351ca02cb0fb295b16b1c05c04394_1440w.jpg)\n\n![图片](https://pica.zhimg.com/v2-124f8c76510c81e86863df1a6664334e_1440w.jpg)\n\n![图片](https://picx.zhimg.com/v2-2ec5728cebfc736d1626476e4f6ea4df_1440w.jpg)\n\n![图片](https://pic3.zhimg.com/v2-c690d64d7e4918261821f89d5b38aa2e_1440w.jpg)\n\n![图片](https://pic1.zhimg.com/v2-ea25777123bc7ac6cff2ae80d1be54e2_1440w.jpg)\n\n![图片](https://pic1.zhimg.com/v2-192b0d3bcac4ccf88f228105ae52b1a6_1440w.jpg)\n\n![图片](https://picx.zhimg.com/v2-71194be145afeb83581b0827168f04d3_1440w.jpg)\n\n![图片](https://pic4.zhimg.com/v2-a65badb53119ac0
